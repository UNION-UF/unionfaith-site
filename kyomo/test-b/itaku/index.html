<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="テストB委託先">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<title>キョウモ テストB 委託先</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../assets/base.css?v=w1">
<style>
/* 委託先は「今日いま対応が要る人」から順に見る。PCは左メニュー、スマホは上タブ。 */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100dvh; align-content: start; }
.side { background: var(--pine-deep); color: var(--on-deep); position: sticky; top: 0; z-index: 8; padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
.side .brand { font-size: 17px; }
.side .role { font-size: 12px; color: var(--on-deep-muted); }
.side .navs { order: 3; flex: 1 0 100%; display: flex; overflow-x: auto; gap: 2px; scrollbar-width: none; min-width: 0; }
.nav { display: flex; align-items: center; gap: 6px; padding: 8px 12px; color: var(--on-deep-muted); min-height: 42px; white-space: nowrap; font-size: 14px; border-bottom: 3px solid transparent; }
.nav .ic { display: none; }
.nav[aria-current="page"] { color: var(--pine-ink); font-weight: 700; border-bottom-color: var(--pine); }
.nav .n { min-width: 18px; padding: 0 5px; border-radius: 3px; background: var(--red); color: var(--on-red); font-size: 11px; line-height: 18px; text-align: center; }
.side .foot { margin-left: auto; }
.proto-btn { display: flex; align-items: center; gap: 6px; color: var(--on-deep); border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; font-size: 12px; min-height: 34px; }
.content { padding: 22px clamp(16px, 3vw, 32px) 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; min-width: 0; padding-left: max(16px, clamp(16px, 3vw, 32px), env(safe-area-inset-left, 0px)); padding-right: max(16px, clamp(16px, 3vw, 32px), env(safe-area-inset-right, 0px)); }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.head h1 { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 2.6vw, 28px); }
.head .meta { color: var(--muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.stat { background: var(--surface); padding: 12px 14px; text-align: left; min-width: 0; }
.stat small { display: block; color: var(--muted); font-size: 12px; }
.stat b { font-size: 28px; font-weight: 700; line-height: 1.2; }
.stat em { font-style: normal; font-size: 13px; color: var(--muted); margin-left: 3px; }
.stat.bad { background: var(--red-soft); }
.stat.bad small, .stat.bad b, .stat.bad em { color: var(--red-ink); }
.stat.warn { background: var(--amber-soft); }
.stat.warn small, .stat.warn b, .stat.warn em { color: var(--amber-ink); }
.filters { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 3px; padding: 6px 13px; font-size: 13px; font-weight: 400; min-height: 38px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: var(--on-pine); font-weight: 700; }
.chip i { font-style: normal; color: var(--red-ink); font-weight: 700; margin-left: 4px; }
.chip[aria-pressed="true"] i { color: inherit; }
.sel-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sel-row select, .sel-row input { border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; background: var(--surface); min-height: 42px; font-size: 16px; max-width: 100%; }
.sel-row input { flex: 1 1 170px; min-width: 0; }
.block { background: var(--surface); border-radius: 4px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; border: 1px solid var(--line); min-width: 0; }
.block h2 { font-size: 15px; font-weight: 700; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; min-width: 0; }
.alert-item { display: flex; justify-content: space-between; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding-block: 8px; border-top: 1px solid var(--line); }
.alert-item:first-of-type { border-top: 0; }
.alert-item .sub { color: var(--muted); font-size: 13px; }
.tablebox { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { font-size: 12px; font-weight: 700; color: var(--muted); text-align: left; padding: 8px 12px; background: var(--sunken); white-space: nowrap; }
td { padding: 9px 12px; border-top: 1px solid var(--line); white-space: nowrap; }
tr.hot td { background: var(--red-soft); }
.mini-btn { min-height: 36px; padding: 3px 12px; font-size: 13px; }
/* シフト表 */
.grid-wrap { overflow: auto; max-height: 70dvh; border: 1px solid var(--line); background: var(--surface); }
.shift { font-size: 12px; border-collapse: separate; border-spacing: 0; }
.shift thead th { position: sticky; top: 0; z-index: 2; }
.shift th, .shift td { padding: 5px 0; text-align: center; min-width: 30px; border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
.shift .nm, .shift .st { position: sticky; background: var(--surface); text-align: left; z-index: 1; border-left: 0; }
.shift .nm { left: 0; padding: 5px 10px; min-width: 104px; font-weight: 700; }
.shift .st { left: 104px; padding: 5px 10px; min-width: 112px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); box-shadow: 1px 0 0 var(--line); }
.shift thead .nm, .shift thead .st { z-index: 3; background: var(--sunken); }
.shift tfoot .nm, .shift tfoot .st { background: var(--sunken); }
.shift .nm small { display: none; font-weight: 400; color: var(--muted); font-size: 10px; }
.shift .today { background: var(--pine-soft); color: var(--pine-ink); font-weight: 700; }
.shift .wk { color: var(--muted); font-weight: 400; display: block; font-size: 10px; }
.m-休 { color: var(--muted); opacity: .55; }
.m-研, .m-M { color: var(--night); font-weight: 700; }
.m-在 { color: var(--amber-ink); font-weight: 700; }
.shift tfoot td { background: var(--sunken); font-weight: 700; }
.meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--pine); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.task-title { font-weight: 700; }
.note { color: var(--muted); font-size: 13px; }
.names { font-size: 13px; color: var(--muted); max-height: 130px; overflow: auto; }
.thumbs { display: flex; gap: 4px; }
.thumbs img { width: 44px; height: 33px; object-fit: cover; border-radius: 5px; background: var(--sunken); display: block; }
.sheet { max-width: 620px; }
.photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.photos figure { margin: 0; display: grid; gap: 4px; }
.photos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; background: var(--sunken); display: block; }
.photos figcaption { font-size: 13px; font-weight: 700; }
.hist-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.teams-card { border: 1px solid var(--line); border-left: 4px solid var(--night); border-radius: 4px; padding: 12px 14px; display: grid; gap: 4px; font-size: 14px; background: var(--sunken); }
.teams-card .ch { font-size: 12px; color: var(--muted); }
.teams-card .open { justify-self: start; margin-top: 4px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; background: var(--surface); font-weight: 700; font-size: 13px; }
.check { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.check input { width: 20px; height: 20px; accent-color: var(--pine); }
.result { width: 100%; text-align: left; padding: 9px 12px; border: 1px solid var(--line); border-radius: 4px; display: grid; gap: 1px; min-height: 44px; }
.result small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
#sfResults { display: grid; gap: 6px; max-height: 200px; overflow-y: auto; }
.search-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 4px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); }
@media (max-width: 860px) {
  /* スマホは氏名の下に登録店舗を出して、日付の列を広く見せる */
  .shift .st { display: none; }
  .shift .nm { box-shadow: 1px 0 0 var(--line); line-height: 1.3; max-width: 118px; white-space: normal; }
  .shift .nm small { display: block; }
}
.kind-seg { background: var(--surface); max-width: 420px; }
.kind-seg button { font-size: 14px; }
.zoom-btn { display: block; width: 100%; padding: 0; cursor: zoom-in; }
.nophoto { aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--line); color: var(--red-ink); font-weight: 700; background: var(--red-soft); }
.lightbox { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column; padding: calc(8px + env(safe-area-inset-top, 0px)) 8px calc(8px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
.lightbox .btn { align-self: flex-end; flex: none; background: #FFFFFF; color: #17233A; }
.lb-scroll { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: center; justify-content: center; touch-action: pinch-zoom pan-x pan-y; }
.lb-scroll img { max-width: 100%; max-height: 100%; }
.scope { background: var(--pine-soft); color: var(--pine-ink); padding: 10px 14px; font-size: 13px; }
.pill.ready { background: var(--ok-soft); color: var(--ok-ink); }
.stats.five { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.stats.five .stat { grid-column: span 2; }
.stats.five .stat:nth-child(n+4) { grid-column: span 3; }
.store-line { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; padding-block: 10px; border-top: 1px solid var(--line); }
.store-line .sub { color: var(--muted); font-size: 13px; }
.store-line .acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#storeMap { height: 260px; border-radius: 4px; background: var(--sunken); z-index: 0; }
.loc-item .sub b { color: var(--amber-ink); font-weight: 700; }
td .locd { display: block; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="content" id="content"></main>
</div>
<div id="overlay"></div>
<div id="toast" role="status" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../assets/core.js?v=b2"></script>
<script>
(function () {
  'use strict';
  const K = window.Kyomo, esc = K.esc, fmt = K.fmt, ic = K.icon;
  const V = {
    page: 'today', f: { today: { area: 'all', pref: 'all' }, shift: { area: 'all', pref: 'all' }, stores: { area: 'all', pref: 'all' }, stock: { area: 'all', pref: 'all' } },
    q: '', st: 'all', limit: 30, storeQ: '', storeLimit: 30, stockKind: 'uniform', stockMonth: K.CUR_MONTH, stockStatus: 'all', stockEdit: false, stockLimit: 30,
    open: {}, draft: { type: 'task', title: '', due: '', body: '', err: '' }, sheet: null, person: null, form: null, backing: false, shortErr: ''
  };
  const $ = (id) => document.getElementById(id);
  let P = K.staffOf(K.S.itaku);
  const IT = () => K.itakuOf(K.S.itaku);
  const myStores = () => K.storesOf(K.S.itaku);
  const prefOf = (p) => { const h = K.homeStore(p); return h ? h.pref : p.pref; };
  const inFilter = (p, f) => (f.area === 'all' || p.area === f.area) && (f.pref === 'all' || prefOf(p) === f.pref);
  const over = () => P.filter((p) => K.status(p).key === 'over');
  const pending = () => over().filter((p) => !K.S.contacted[p.id]);
  /* 位置の確認が必要な人。報告はあるが、店舗の近くと判定できなかった人 */
  const locIssues = () => P.filter((p) => { const r = K.report(p), li = r && K.locInfo(r); return li && li.check; });
  const locPending = () => locIssues().filter((p) => !K.S.locChecked[p.id]);
  const dateLabel = K.MONTH + '月' + K.TODAY + '日(' + K.weekday(K.TODAY) + ')';
  const homeName = (p) => { const h = K.homeStore(p); return h ? h.name : '移動型'; };
  const STATE = { ready: ['準備完了', 'ok'], wait: ['確認中', 'warn'], none: ['予定なし', 'idle'] };
  let toastT;
  function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

  function renderSide() {
    const mk = K.CUR_MONTH;
    const wait = ['uniform', 'incam'].reduce((n, kind) => n + P.filter((p) => K.isTarget(kind, mk, p.id) && (K.invOf(kind, mk, p.id) || {}).status === 'wait').length, 0);
    const reqs = K.S.storeRequests.filter((r) => r.state === 'open' && r.itaku === K.S.itaku).length;
    const nav = [['today', '今日の報告', 'check', pending().length + (K.gpsOn(K.S.itaku) ? locPending().length : 0)], ['stores', '店舗', 'store', reqs], ['shift', 'シフト', 'grid', 0], ['stock', '棚卸し', 'box', wait], ['tasks', '提出物・お知らせ', 'list', 0], ['set', '設定', 'sliders', 0]];
    $('side').innerHTML = '<span class="brand">キョウモ テストB</span><span class="role">委託先 ／ ' + esc(IT().name) + '</span><div class="navs">' +
      nav.map((n) => '<button class="nav" data-page="' + n[0] + '"' + (V.page === n[0] ? ' aria-current="page"' : '') + '>' + ic(n[2], 20) + n[1] + (n[3] ? '<span class="n num">' + n[3] + '</span>' : '') + '</button>').join('') +
      '</div><div class="foot"><button class="proto-btn" data-sheet="demo">' + ic('sliders', 15) + '試作</button></div>';
  }

  /* 地方と県の絞り込み。自社の担当エリアだけを出す */
  function regionFilter(key, allowAll, extra) {
    const f = V.f[key];
    const areas = K.AREAS.filter((a) => IT().areas.includes(a.id) && (myStores().some((s) => s.area === a.id) || P.some((p) => p.area === a.id)));
    const chips = '<button class="chip" data-farea="all" data-fkey="' + key + '" aria-pressed="' + (f.area === 'all') + '">全地方</button>' + areas.map((a) => {
      const c = key === 'today' ? pending().filter((p) => p.area === a.id).length : 0;
      return '<button class="chip" data-farea="' + a.id + '" data-fkey="' + key + '" aria-pressed="' + (f.area === a.id) + '">' + a.name + (c ? '<i class="num">' + c + '</i>' : '') + '</button>';
    }).join('');
    const prefSet = new Set();
    myStores().forEach((s) => { if (f.area === 'all' || s.area === f.area) prefSet.add(s.pref); });
    P.forEach((p) => { if (f.area === 'all' || p.area === f.area) prefSet.add(p.pref); });
    const prefs = Object.keys(K.PREF_AREA).filter((x) => prefSet.has(x));
    const sel = '<select id="fpref" data-fkey="' + key + '" aria-label="県を選ぶ"><option value="all">すべての県</option>' + prefs.map((x) => '<option' + (f.pref === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select>';
    return '<div class="filters"><div class="chips" role="group" aria-label="地方">' + chips + '</div><div class="sel-row">' + sel + (extra || '') + '</div></div>';
  }

  function storeRows() {
    const f = V.f.today;
    return myStores().filter((s) => (f.area === 'all' || s.area === f.area) && (f.pref === 'all' || s.pref === f.pref)).map((s) => Object.assign({ s }, K.storeInfo(s.id))).filter((x) => x.exp.length);
  }
  function todayPage() {
    const f = V.f.today, list = P.filter((p) => inFilter(p, f)), plan = list.filter(K.needsReport);
    const got = list.filter((p) => K.report(p));
    const ov = list.filter((p) => K.status(p).key === 'over');
    const rows = storeRows(), ready = rows.filter((x) => x.state === 'ready'), wait = rows.filter((x) => x.state === 'wait');
    const complete = wait.filter((x) => !x.confirmed && x.got.length === x.exp.length);
    const dl = fmt(K.deadline(K.S.itaku));
    let h = '<div class="head"><h1>今日の報告</h1><span class="meta num">' + dateLabel + ' ／ 確認の時刻 ' + dl + (K.isTest() ? '（テスト時刻 ' + fmt(K.now()) + '）' : '') + '</span></div>';
    h += '<p class="scope">この画面は' + esc(IT().name) + 'だけが見られます。他社のスタッフは表示しません。個人の氏名と報告状況は発注側に出しません。</p>';
    h += regionFilter('today', true);
    h += '<div class="stats five"><div class="stat"><small>今日の予定</small><b class="num">' + plan.length + '</b><em>人</em></div><div class="stat"><small>報告済み</small><b class="num">' + got.length + '</b><em>人</em></div>' +
      '<div class="stat' + (ov.length ? ' bad' : '') + '"><small>未報告</small><b class="num">' + ov.length + '</b><em>人</em></div><div class="stat"><small>準備完了の店舗</small><b class="num">' + ready.length + '</b><em>店舗</em></div><div class="stat' + (wait.length ? ' warn' : '') + '"><small>確認中の店舗</small><b class="num">' + wait.length + '</b><em>店舗</em></div></div>';
    if (ov.length) {
      h += '<section class="block"><h2>連絡が必要な人（確認の時刻 ' + dl + ' を過ぎて未報告）</h2>' + ov.sort((a, b) => (K.S.contacted[a.id] ? 1 : 0) - (K.S.contacted[b.id] ? 1 : 0)).map((p) => '<div class="alert-item"><div><b>' + esc(p.name) + '</b><div class="sub">' + esc(prefOf(p)) + ' ／ ' + esc(homeName(p)) + '</div></div>' + (K.S.contacted[p.id] ? '<span class="pill idle">連絡済み</span>' : '<button class="btn" data-contact="' + p.id + '">連絡済みにする</button>') + '</div>').join('') + '</section>';
    }
    const li = locIssues().filter((p) => inFilter(p, f));
    if (K.gpsOn(K.S.itaku) && li.length) {
      h += '<section class="block"><h2>位置の確認が必要な人（店舗から' + K.radius(K.S.itaku) + 'm以内と判定できなかった報告）</h2>' + li.sort((a, b) => (K.S.locChecked[a.id] ? 1 : 0) - (K.S.locChecked[b.id] ? 1 : 0)).map((p) => {
        const r = K.report(p), x = K.locInfo(r), st = K.store(r.storeId);
        return '<div class="alert-item loc-item"><div><b>' + esc(p.name) + '</b><div class="sub">' + esc(st ? st.name : '') + ' ／ <b>' + esc(x.short) + '</b> ／ ' + esc(x.detail) + '</div></div>' + (K.S.locChecked[p.id] ? '<span class="pill idle">確認済み</span>' : '<button class="btn" data-locok="' + p.id + '">確認済みにする</button>') + '</div>';
      }).join('') + '<p class="note">本人に状況を確かめたら「確認済みにする」を押します。この情報は発注側には表示しません。</p></section>';
    }
    h += '<section class="block"><div class="row"><h2>店舗の確定</h2>' + (complete.length ? '<button class="btn primary" id="confirmAll">報告が揃った' + complete.length + '店舗を確定する</button>' : '') + '</div><p class="note">発注側には店舗の結果だけを渡します。確定しても、発注側の表示が変わるのは確認の時刻を過ぎてからです。切り替わりの時刻から個人の到着が分からないようにするためです。</p><div>' + (rows.map((x) => {
      const st = x.scheduled ? ['確定済み ' + dl + 'に表示', 'ok'] : STATE[x.state];
      return '<div class="store-line"><div><b>' + esc(x.s.name) + '</b><div class="sub num">' + esc(x.s.pref) + ' ／ 報告 ' + x.got.length + '/' + x.exp.length + '人</div></div><div class="acts"><span class="pill ' + st[1] + '">' + st[0] + '</span>' + (x.confirmed ? '<button class="btn mini-btn" data-unconfirm="' + esc(x.s.id) + '">取り消す</button>' : (x.state === 'wait' ? '<button class="btn mini-btn" data-confirm="' + esc(x.s.id) + '">確定する</button>' : '')) + '</div></div>';
    }).join('') || '<p class="muted">今日の予定がある店舗はありません。</p>') + '</div></section>';
    h += shortageBlock();

  /* Googleマップのリンクや「緯度, 経度」から位置を読み取る */
  function parseLatLng(text) {
    const t = String(text || '');
    if (/(^|\/\/)(maps\.app\.goo\.gl|goo\.gl\/maps)/.test(t)) return { short: true };
    const pats = [/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /@(-?\d+\.\d+),(-?\d+\.\d+)/, /[?&](?:q|ll|query|destination)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/i, /^\s*(-?\d{1,2}\.\d+)\s*[,、 ]\s*(-?\d{2,3}\.\d+)\s*$/];
    for (const p of pats) { const m = p.exec(t); if (m) return { lat: +m[1], lng: +m[2] }; }
    return null;
  }
  const prefFromText = (text) => Object.keys(K.PREF_AREA).find((p) => String(text || '').includes(p)) || '';
  let map = null, marker = null, circle = null;
  function posText() {
    const F = V.form, el = $('sfPos');
    if (!el) return;
    el.textContent = F.lat != null ? '位置 ' + F.lat.toFixed(5) + ', ' + F.lng.toFixed(5) + ' ／ 判定の範囲 ' + K.radius(K.S.itaku) + 'm' : 'まだ位置が決まっていません。上で店舗を探すか、地図を押してください。';
  }
  function setPos(lat, lng, zoom) {
    const F = V.form;
    F.lat = lat; F.lng = lng; posText();
    if (!window.L || !map) return;
    const ll = [lat, lng];
    if (!marker) {
      marker = L.marker(ll, { draggable: true, icon: L.divIcon({ className: '', html: '<div style="width:22px;height:22px;border-radius:50%;background:#C2410C;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(map);
      marker.on('dragend', () => { const p = marker.getLatLng(); setPos(p.lat, p.lng); });
      circle = L.circle(ll, { radius: K.radius(K.S.itaku), color: '#17305C', weight: 2, fillOpacity: 0.12 }).addTo(map);
    } else { marker.setLatLng(ll); circle.setLatLng(ll); }
    map.setView(ll, zoom || map.getZoom());
  }
  function openStoreForm(st, extra) {
    V.form = Object.assign(st ? { id: st.id, name: st.name, pref: st.pref, lat: st.lat, lng: st.lng } : { id: null, name: '', pref: '', lat: null, lng: null }, extra || {});
    V.sheet = 'store';
    if (map) { try { map.remove(); } catch (e) { /* 無視 */ } }
    map = marker = circle = null;
    $('overlay').innerHTML = storeSheet();
    posText();
    const F = V.form;
    if (window.L) {
      const has = F.lat != null;
      map = L.map('storeMap', { scrollWheelZoom: false }).setView(has ? [F.lat, F.lng] : [34.18, 131.47], has ? 17 : 9);
      L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>' }).addTo(map);
      map.on('click', (e) => setPos(e.latlng.lat, e.latlng.lng));
      if (has) setPos(F.lat, F.lng, 17);
      setTimeout(() => map && map.invalidateSize(), 260);
    } else {
      $('storeMap').innerHTML = '<p class="note" style="padding:14px">地図を読み込めませんでした。リンクの貼り付けと店舗名での検索は使えます。</p>';
    }
  }
  function sfMessage(t) { const m = $('sfMsg'); if (m) { m.textContent = t || ''; m.hidden = !t; } }
  async function searchStore() {
    const q = $('sfQ').value.trim(), box = $('sfResults');
    sfMessage(''); box.innerHTML = '';
    if (!q) { sfMessage('Googleマップのリンク、店舗名、住所のどれかを入れてください。'); return; }
    const parsed = parseLatLng(q);
    if (parsed && parsed.short) { sfMessage('スマホの共有ボタンで作る短いリンクは読み取れません。パソコンのブラウザでGoogleマップを開き、上に出るURLを貼ってください。'); return; }
    if (parsed) { setPos(parsed.lat, parsed.lng, 17); return; }
    box.innerHTML = '<p class="note">探しています。</p>';
    const out = [];
    const [osm, gsi] = await Promise.allSettled([
      fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=jp&accept-language=ja&q=' + encodeURIComponent(q)).then((r) => r.json()),
      fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q)).then((r) => r.json())
    ]);
    if (osm.status === 'fulfilled' && Array.isArray(osm.value)) osm.value.forEach((x) => out.push({ name: x.name || String(x.display_name).split(',')[0], addr: x.display_name, lat: +x.lat, lng: +x.lon, src: 'OpenStreetMap' }));
    if (gsi.status === 'fulfilled' && Array.isArray(gsi.value)) gsi.value.slice(0, 5).forEach((x) => out.push({ name: x.properties.title, addr: x.properties.title, lat: x.geometry.coordinates[1], lng: x.geometry.coordinates[0], src: '国土地理院' }));
    V.results = out;
    if (!out.length) {
      box.innerHTML = '';
      sfMessage(osm.status === 'rejected' && gsi.status === 'rejected' ? '検索につながりませんでした。少し待ってやり直してください。' : '見つかりませんでした。住所で探すか、Googleマップのリンクを貼ってください。');
      return;
    }
    box.innerHTML = out.map((x, i) => '<button class="result" type="button" data-result="' + i + '"><span>' + esc(x.name) + '</span><small>' + esc(x.addr) + '（' + x.src + '）</small></button>').join('');
  }

  }

  function personSheet() {
    const { kind, mk, pid } = V.person, def = K.KINDS[kind], p = K.byId[pid], inv = K.invOf(kind, mk, pid), target = K.isTarget(kind, mk, pid);
    const s = inv ? K.INV_STATUS[inv.status] : { label: target ? '未提出' : '対象外', pill: 'idle' };
    let h = '<div class="sheet-back" data-close="1"></div><div class="sheet" role="dialog" aria-label="棚卸しの確認"><div class="row"><h2>' + esc(p.name) + 'さん</h2><span class="pill ' + s.pill + '">' + s.label + '</span></div><p class="note">' + def.title + ' ／ ' + esc(prefOf(p)) + ' ／ ' + esc(homeName(p)) + ' ／ ' + K.monthLabel(mk) + '分' + (inv ? ' ／ 提出 ' + esc(inv.date) : '') + '</p>';
    h += '<div class="seg" role="group" aria-label="種類を切り替える">' + Object.values(K.KINDS).map((x) => '<button data-pkind="' + x.id + '" aria-pressed="' + (x.id === kind) + '">' + x.title + '</button>').join('') + '</div>';
    h += '<div class="hist-chips" aria-label="月を切り替える">' + [0, 1, 2].map((b) => { const m = K.monthKey(b), t = K.isTarget(kind, m, pid), i = K.invOf(kind, m, pid); return '<button class="chip" data-pmonth="' + m + '" aria-pressed="' + (m === mk) + '">' + K.monthLabel(m) + '：' + (!t ? '対象外' : i ? K.INV_STATUS[i.status].label : '未提出') + '</button>'; }).join('') + '</div>';
    if (inv) {
      h += '<p class="note">' + def.mark + 'が読めるか確認してください。写真を押すと大きく表示します。</p><div class="photos">' + def.units.map((u) => {
        const id = (inv.photos || {})[u.k], miss = (inv.missing || []).includes(u.k);
        return '<figure>' + (miss ? '<div class="nophoto">手元にない</div>' : '<button class="zoom-btn" data-zoom="1" aria-label="' + u.n + 'の写真を拡大"><img alt="' + u.n + 'の写真" data-photo="' + esc(id || 'sample') + '" data-key="' + pid + u.k + mk + '" data-label="' + u.n + '"></button>') + '<figcaption>' + u.n + '</figcaption></figure>';
      }).join('') + '</div>';
      if (def.counts.length) h += '<div class="tablebox"><table><thead><tr><th>付属品</th><th>貸与</th><th>申告</th></tr></thead><tbody>' + def.counts.map((c) => { const v = (inv.counts || {})[c.k] !== undefined ? inv.counts[c.k] : c.lent; return '<tr><td>' + c.n + '</td><td class="num">' + c.lent + c.u + '</td><td class="num">' + (v !== c.lent ? '<span class="pill bad">' + v + c.u + '</span>' : v + c.u) + '</td></tr>'; }).join('') + '</tbody></table></div>';
      const dfs = K.invDiffs(kind, inv);
      if (dfs.length) h += '<p class="small" style="color:var(--red-ink)"><b>差異：</b>' + esc(dfs.join('、')) + '</p>';
      if (inv.status === 'back' && inv.backNote) h += '<p class="small"><b>差し戻しの理由：</b>' + esc(inv.backNote) + '</p>';
      if (V.backing) {
        h += '<div class="field"><label for="backNote">差し戻しの理由</label><textarea id="backNote" placeholder="例: ' + def.mark + 'が読めません"></textarea></div><div id="backErr" class="err" hidden></div><div class="sel-row"><button class="btn primary" id="sendBack">差し戻す</button><button class="btn" id="cancelBack">やめる</button></div>';
      } else if (inv.status === 'wait') {
        h += '<div class="sel-row"><button class="btn primary" id="invOk">' + ic('check', 18) + '確認済みにする</button><button class="btn" id="invBack">差し戻す</button></div>';
      } else if (inv.status === 'ok') {
        h += '<div><button class="btn" id="invBack">差し戻す</button></div>';
      }
    } else {
      h += '<p class="note">' + (target ? 'まだ提出されていません。' : 'この月は' + def.title + 'の対象外です。') + '</p>';
    }
    return h + '<button class="btn" data-close="1">閉じる</button></div>';
  }

  function tasksPage() {
    const total = P.length, d = V.draft;
    const card = (x, kind) => {
      const doneList = P.filter((p) => K.isDone(x.id, p.id, x.ratio));
      const rest = P.filter((p) => !doneList.includes(p));
      const pct = Math.round(doneList.length / total * 100);
      return '<section class="block"><div class="row"><span class="task-title">' + esc(x.title) + '</span><span class="note">' + (kind === 'task' ? '提出物' + (x.due ? ' 締切 ' + esc(x.due) : '') : 'お知らせ') + '</span></div><div class="meter" role="img" aria-label="' + total + '人中' + doneList.length + '人"><i style="width:' + pct + '%"></i></div><div class="row"><span class="small num"><b>' + doneList.length + '</b>/' + total + '人 ' + (kind === 'task' ? '提出' : '確認') + '（' + pct + '%）</span>' + (rest.length ? '<button class="btn mini-btn" data-toggle="' + esc(x.id) + '">' + (V.open[x.id] ? '閉じる' : (kind === 'task' ? '未提出' : '未確認') + 'を見る') + '</button>' : '') + '</div>' + (V.open[x.id] ? '<div class="names">' + esc(rest.map((p) => p.name).join('、')) + '</div>' : '') + '</section>';
    };
    return '<div class="head"><h1>提出物・お知らせ</h1></div><p class="scope">配信できるのは自社のスタッフだけです。発注側には完了数だけを渡します。</p>' +
      '<form class="block" id="postForm"><h2>新しく配信する</h2><div class="two"><div class="field"><label for="nType">種類</label><select id="nType"><option value="task"' + (d.type === 'task' ? ' selected' : '') + '>提出物</option><option value="notice"' + (d.type === 'notice' ? ' selected' : '') + '>お知らせ</option></select></div><div class="field"><label for="nDue">締切（提出物のみ）</label><input id="nDue" value="' + esc(d.due) + '" placeholder="例: ' + K.md(10) + '"></div></div><div class="field"><label for="nTitle">件名</label><input id="nTitle" value="' + esc(d.title) + '" placeholder="例: 冬用ジャケットのサイズ確認"></div><div class="field"><label for="nBody">本文</label><textarea id="nBody">' + esc(d.body) + '</textarea></div>' + (d.err ? '<div class="err">' + esc(d.err) + '</div>' : '') + '<div><button class="btn primary" type="submit">自社のスタッフに配信する</button></div></form>' +
      K.tasks(K.S.itaku).map((t) => card(t, 'task')).join('') + K.notices(K.S.itaku).map((n) => card(n, 'notice')).join('');
  }

  function setPage() {
    const t = K.S.settings;
    return '<div class="head"><h1>設定</h1></div>' +
      '<section class="block"><h2>報告の確認</h2><div class="two"><div class="field"><label for="setDl">確認の時刻</label><input id="setDl" type="time" value="' + fmt(K.deadline(K.S.itaku)) + '"></div><div class="field"><label for="setTarget">未報告の通知先</label><select id="setTarget">' + [['both', '委託先と本人'], ['itaku', '委託先のみ']].map((o) => '<option value="' + o[0] + '"' + (t.target === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div></div><p class="note">確認の時刻は各委託先が決めます。発注側には通知しません。</p></section>' +
      '<section class="block"><h2>位置の確認</h2><div class="seg" style="max-width:560px"><button data-setgps="1" aria-pressed="' + K.gpsOn(K.S.itaku) + '">使う（報告を押した瞬間だけ）</button><button data-setgps="0" aria-pressed="' + !K.gpsOn(K.S.itaku) + '">使わない</button></div>' +
        (K.gpsOn(K.S.itaku) ? '<div class="field" style="max-width:280px"><label for="setRadius">店舗の近くとみなす範囲</label><select id="setRadius">' + [100, 200, 300, 500].map((v) => '<option value="' + v + '"' + (K.radius(K.S.itaku) === v ? ' selected' : '') + '>店舗から' + v + 'm以内</option>').join('') + '</select></div>' : '') +
        '<p class="note">報告を押した瞬間の位置と、店舗の登録位置との距離で判定します。移動中や休みの日の位置は取りません。結果を見られるのは本人と委託先だけで、発注側には表示しません。使う前に、本人への説明と同意、アライアンス先の許可を整えてください。</p></section>' +
      '<section class="block"><h2>相談窓口</h2><div class="field"><label for="setInner">社内の窓口の連絡先</label><input id="setInner" value="' + esc(t.inner) + '"></div><div class="field"><label for="setOuter">社外の窓口の連絡先</label><input id="setOuter" value="' + esc(t.outer) + '"></div><p class="note">設定するのは連絡先だけです。誰が相談したか、何を相談したかは、このアプリには残りません。</p></section>';
  }

  function demoSheet() {
    return '<div class="sheet-back" data-close="1"></div><div class="sheet" role="dialog" aria-label="試作の操作"><h2>試作の操作</h2>' +
      '<div class="field"><span class="lab">委託先を切り替える</span><div class="seg">' + K.ITAKU.map((i) => '<button data-itaku="' + i.id + '" aria-pressed="' + (K.S.itaku === i.id) + '">' + esc(i.name) + '</button>').join('') + '</div><span class="small muted">各社の画面には、自社のスタッフと店舗だけが出ます。</span></div>' +
      '<div class="field"><span class="lab">時刻 <span class="num">' + fmt(K.now()) + '</span>' + (K.isTest() ? '（テスト中）' : '（実際の時刻）') + '</span><div class="jump-row">' + [[592, '09:52'], [616, '10:16']].map((j) => '<button class="btn num" data-jump="' + j[0] + '">' + j[1] + '</button>').join('') + (K.isTest() ? '<button class="btn primary" data-jump="real">実際の時刻に戻す</button>' : '') + '</div></div>' +
      '<a class="btn" href="../" style="text-decoration:none">' + ic('users', 18) + 'スタッフの画面を開く</a><a class="btn" href="../client/" style="text-decoration:none">' + ic('store', 18) + '発注側の画面を開く</a><button class="btn" data-reset="1">最初の状態に戻す</button><p class="proto">テストB ／ データは架空のサンプルで、この端末の中だけに保存します。</p><button class="btn primary" data-close="1">閉じる</button></div>';
  }

  function renderOverlay() {
    if (V.sheet === 'demo') $('overlay').innerHTML = demoSheet();
    else if (V.sheet === 'store') { if (!$('storeMap')) openStoreForm(V.form && V.form.id ? K.store(V.form.id) : null, V.form || {}); }
    else if (V.sheet === 'person') { $('overlay').innerHTML = personSheet(); K.hydratePhotos($('overlay')); }
    else $('overlay').innerHTML = '';
  }
  function render() {
    P = K.staffOf(K.S.itaku);
    renderSide();
    $('content').innerHTML = ({ today: todayPage, shift: shiftPage, stores: storesPage, stock: stockPage, tasks: tasksPage, set: setPage }[V.page])();
    if (V.page === 'today') renderTable();
    K.hydratePhotos($('content'));
    renderOverlay();
  }
  function openPerson(kind, mk, pid) { V.person = { kind, mk, pid }; V.sheet = 'person'; V.backing = false; renderOverlay(); }
  function closeSheet() { if (map) { try { map.remove(); } catch (e) { /* 無視 */ } map = marker = circle = null; } V.sheet = null; V.person = null; V.form = null; V.backing = false; $('overlay').innerHTML = ''; }
  function resetFilters() { Object.keys(V.f).forEach((k) => { V.f[k] = { area: 'all', pref: 'all' }; }); V.limit = 30; V.stockLimit = 30; V.storeLimit = 30; V.q = ''; V.storeQ = ''; V.st = 'all'; V.shortErr = ''; }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button, [data-close]');
    if (!b) return;
    const d = b.dataset;
    if (d.page) { V.page = d.page; window.scrollTo(0, 0); render(); return; }
    if (d.farea) { const f = V.f[d.fkey]; f.area = d.farea; f.pref = 'all'; V.limit = 30; V.stockLimit = 30; V.storeLimit = 30; render(); return; }
    if (d.more) { V.limit += 30; renderTable(); return; }
    if (d.storemore) { V.storeLimit += 30; render(); return; }
    if (d.stockmore) { V.stockLimit += 30; render(); return; }
    if (d.contact) { K.S.contacted[d.contact] = true; K.save(); render(); return; }
    if (d.confirm) { K.S.confirmed[d.confirm] = true; K.save(); render(); toast('確定しました'); return; }
    if (d.unconfirm) { delete K.S.confirmed[d.unconfirm]; K.save(); render(); toast('確定を取り消しました'); return; }
    if (b.id === 'confirmAll') { storeRows().filter((x) => x.state === 'wait' && !x.confirmed && x.got.length === x.exp.length).forEach((x) => { K.S.confirmed[x.s.id] = true; }); K.save(); render(); toast('報告が揃った店舗を確定しました'); return; }
    if (b.id === 'shSend') {
      const text = $('shText').value.trim(), compact = text.replace(/\s/g, '');
      if (!text) { V.shortErr = '内容を入れてください。'; render(); return; }
      if (K.staff.some((p) => compact.includes(p.name.replace(/\s/g, '')) || compact.includes(p.name.split(' ')[0] + 'さん'))) { V.shortErr = '個人名は書かないでください。店舗の状況だけを書いてください。'; render(); return; }
      K.S.shortages.unshift({ id: 'sh' + Date.now(), storeId: $('shStore').value, itaku: K.S.itaku, text });
      V.shortErr = ''; K.save(); render(); toast('発注側へ報告しました'); return;
    }
    if (d.shdel) { K.S.shortages = K.S.shortages.filter((n) => n.id !== d.shdel); K.save(); render(); return; }
    if (d.toggle) { V.open[d.toggle] = !V.open[d.toggle]; render(); return; }
    if (d.sheet === 'demo') { V.sheet = 'demo'; renderOverlay(); return; }
    if (d.close) { closeSheet(); render(); return; }
    if (d.itaku) { K.S.itaku = d.itaku; K.save(); resetFilters(); closeSheet(); render(); return; }
    if (d.jump) { if (d.jump === 'real') K.setReal(); else K.setNow(+d.jump); closeSheet(); render(); return; }
    if (d.reset) { K.reset(); closeSheet(); resetFilters(); render(); toast('最初の状態に戻しました'); return; }
    if (b.id === 'remindAll') { K.S.reminded[V.stockKind] = true; K.save(); render(); toast('未提出の人に催促を送りました'); return; }
    if (b.id === 'addStore') { openStoreForm(null); return; }
    if (d.reqok) { const r = K.S.storeRequests.find((y) => y.id === d.reqok); openStoreForm(null, { name: r.name, pref: K.byId[r.pid].pref, fromReq: r.id }); return; }
    if (d.editstore) { openStoreForm(K.store(d.editstore)); return; }
    if (d.locok) { K.S.locChecked[d.locok] = true; K.save(); render(); toast('確認済みにしました'); return; }
    if (b.id === 'sfSearch') { searchStore(); return; }
    if (b.id === 'sfHere') {
      sfMessage('');
      if (!navigator.geolocation) { sfMessage('この端末では位置情報を使えません。'); return; }
      navigator.geolocation.getCurrentPosition((pos) => setPos(pos.coords.latitude, pos.coords.longitude, 17), () => sfMessage('位置を取得できませんでした。ブラウザの位置情報を許可してください。'), { enableHighAccuracy: true, timeout: 9000, maximumAge: 0 });
      return;
    }
    if (d.result !== undefined) {
      const x = V.results[+d.result], F = V.form;
      if (!$('sfName').value.trim()) { $('sfName').value = x.name; F.name = x.name; }
      const pref = prefFromText(x.addr);
      if (pref && [...$('sfPref').options].some((o) => o.value === pref)) { $('sfPref').value = pref; F.pref = pref; }
      setPos(x.lat, x.lng, 17);
      $('sfResults').innerHTML = '';
      return;
    }
    if (d.setgps !== undefined) { K.S.settings.gps[K.S.itaku] = d.setgps === '1'; K.save(); render(); toast(d.setgps === '1' ? '位置の確認を使う設定にしました' : '位置の確認を使わない設定にしました'); return; }
    if (d.reqno) { const r = K.S.storeRequests.find((y) => y.id === d.reqno); r.state = 'no'; K.save(); render(); toast('申請を却下しました'); return; }
    if (b.id === 'sfSave') {
      const F = V.form, name = $('sfName').value.trim(), pref = $('sfPref').value, err = $('sfErr');
      const msg = !name ? '店舗名を入れてください。' : !pref ? '都道府県を選んでください。' : F.lat == null ? '店舗の位置を決めてください。' : '';
      if (msg) { err.textContent = msg; err.hidden = false; return; }
      const data = { name, pref, area: K.PREF_AREA[pref], lat: F.lat, lng: F.lng };
      if (F.id) K.updateStore(F.id, data); else K.addStore(data);
      K._sm = null;
      if (F.fromReq) { const r = K.S.storeRequests.find((y) => y.id === F.fromReq); r.state = 'ok'; K.save(); }
      closeSheet(); render(); toast('店舗を保存しました'); return;
    }
    if (d.kind) { V.stockKind = d.kind; V.stockEdit = false; V.stockLimit = 30; render(); return; }
    if (d.month) { V.stockMonth = d.month; V.stockEdit = false; V.stockLimit = 30; render(); return; }
    if (b.id === 'stockEdit') { V.stockEdit = !V.stockEdit; V.stockLimit = 30; render(); return; }
    if (d.allt !== undefined) { P.filter((p) => inFilter(p, V.f.stock)).forEach((p) => K.setTarget(V.stockKind, V.stockMonth, p.id, d.allt === '1')); render(); toast(d.allt === '1' ? '全員を対象にしました' : '全員を対象から外しました'); return; }
    if (d.person) { openPerson(V.stockKind, V.stockMonth, d.person); return; }
    if (d.pmonth) { openPerson(V.person.kind, d.pmonth, V.person.pid); return; }
    if (d.pkind) { openPerson(d.pkind, V.person.mk, V.person.pid); return; }
    if (d.zoom) { const im = b.querySelector('img'); if (im) { const box = document.createElement('div'); box.className = 'lightbox'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', '写真の拡大'); box.innerHTML = '<button class="btn" data-unzoom="1">閉じる</button><div class="lb-scroll"><img alt=""></div>'; box.querySelector('img').src = im.src; box.querySelector('img').alt = im.alt; document.body.appendChild(box); } return; }
    if (d.unzoom) { const lb = document.querySelector('.lightbox'); if (lb) lb.remove(); return; }
    if (b.id === 'invOk') { const { kind, mk, pid } = V.person; K.setInv(kind, mk, pid, Object.assign({}, K.invOf(kind, mk, pid), { status: 'ok', backNote: '' })); render(); toast('確認済みにしました'); return; }
    if (b.id === 'invBack') { V.backing = true; renderOverlay(); return; }
    if (b.id === 'cancelBack') { V.backing = false; renderOverlay(); return; }
    if (b.id === 'sendBack') {
      const note = $('backNote').value.trim();
      if (!note) { const er = $('backErr'); er.textContent = '差し戻しの理由を入れてください。'; er.hidden = false; return; }
      const { kind, mk, pid } = V.person;
      K.setInv(kind, mk, pid, Object.assign({}, K.invOf(kind, mk, pid), { status: 'back', backNote: note }));
      V.backing = false; render(); toast('差し戻しました'); return;
    }
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'postForm') return;
    e.preventDefault();
    const d = V.draft;
    if (!d.title.trim()) { d.err = '件名を入れてください。'; render(); return; }
    if (d.type === 'task' && !d.due.trim()) { d.err = '提出物には締切を入れてください。'; render(); return; }
    const id = 'p' + Date.now();
    if (d.type === 'task') K.S.posted.tasks.unshift({ id, itaku: K.S.itaku, title: d.title.trim(), body: d.body.trim() || '内容を確認して、提出してください。', due: d.due.trim(), ratio: 0 });
    else K.S.posted.notices.unshift({ id, itaku: K.S.itaku, title: d.title.trim(), body: d.body.trim() || '内容を確認してください。', date: K.md(0), ratio: 0, important: false });
    K.save();
    V.draft = { type: d.type, title: '', due: '', body: '', err: '' };
    render(); toast('自社のスタッフに配信しました');
  });
  document.addEventListener('input', (e) => {
    const t = e.target, s = K.S.settings;
    if (t.id === 'q') { V.q = t.value; V.limit = 30; renderTable(); }
    if (t.id === 'storeQ') {
      V.storeQ = t.value;
      const pos = t.selectionStart; render();
      const n = $('storeQ'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) { /* 無視 */ } }
    }
    if (t.id === 'nTitle') V.draft.title = t.value;
    if (t.id === 'nDue') V.draft.due = t.value;
    if (t.id === 'nBody') V.draft.body = t.value;
    if (t.id === 'setInner') { s.inner = t.value; K.save(); }
    if (t.id === 'setOuter') { s.outer = t.value; K.save(); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target, s = K.S.settings, d = t.dataset;
    if (t.id === 'fpref') { V.f[d.fkey].pref = t.value; V.limit = 30; V.stockLimit = 30; V.storeLimit = 30; render(); }
    if (t.id === 'st') { V.st = t.value; V.limit = 30; renderTable(); }
    if (t.id === 'stockStatus') { V.stockStatus = t.value; V.stockLimit = 30; render(); }
    if (t.id === 'nType') V.draft.type = t.value;
    if (t.id === 'setDl') { const m = K.parseTime(t.value); if (m != null) { s.deadlines[K.S.itaku] = m; K.save(); renderSide(); } }
    if (t.id === 'setTarget') { s.target = t.value; K.save(); }
    if (t.id === 'setRadius') { s.radius[K.S.itaku] = +t.value; K.save(); toast('範囲を' + t.value + 'mにしました'); }
    if (d.tg) { K.setTarget(V.stockKind, V.stockMonth, d.tg, t.checked); }
  });
  const activeIsForm = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); };
  let last = K.nowMin();
  setInterval(() => {
    const m = K.nowMin();
    if (m !== last) { last = m; if (!activeIsForm() && !V.sheet) render(); }
  }, 1000);
  K.onChange(() => { if (!activeIsForm() && !V.sheet) render(); });
  render();
})();
</script>
</body>
</html>
