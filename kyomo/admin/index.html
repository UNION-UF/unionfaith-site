<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B4A3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="キョウモ管理">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<title>キョウモ 管理者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../assets/base.css?v=5">
<style>
/* 管理者は「今日いま対応が要る人」から順に見る。PCは左メニュー、スマホは上タブ。 */
.shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100dvh; }
.side { background: var(--pine-deep); color: var(--on-deep); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100dvh; }
.side .brand { font-size: 20px; padding: 0 10px; }
.side .role { font-size: 12px; color: var(--on-deep-muted); padding: 0 10px 14px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; color: var(--on-deep-muted); font-weight: 500; width: 100%; text-align: left; min-height: 44px; white-space: nowrap; }
.nav[aria-current="page"] { background: rgba(255, 255, 255, .12); color: var(--on-deep); font-weight: 700; }
.nav .n { margin-left: auto; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--red); color: var(--on-red); font-size: 11px; line-height: 20px; text-align: center; }
.side .foot { margin-top: auto; display: grid; gap: 8px; }
.proto-btn { display: flex; align-items: center; gap: 8px; color: var(--on-deep); border: 1px solid rgba(255, 255, 255, .28); border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 600; min-height: 42px; }
.content { padding: 22px clamp(16px, 3vw, 32px) 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; min-width: 0; padding-left: max(16px, clamp(16px, 3vw, 32px), env(safe-area-inset-left, 0px)); padding-right: max(16px, clamp(16px, 3vw, 32px), env(safe-area-inset-right, 0px)); }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.head h1 { font-family: var(--display); font-weight: 900; font-size: clamp(22px, 2.6vw, 28px); }
.head .meta { color: var(--muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border-radius: 14px; padding: 12px 14px; box-shadow: 0 1px 0 var(--line); text-align: left; min-width: 0; }
.stat small { display: block; color: var(--muted); font-size: 12px; }
.stat b { font-size: 28px; font-weight: 600; line-height: 1.2; }
.stat em { font-style: normal; font-size: 13px; color: var(--muted); margin-left: 3px; }
.stat.bad { background: var(--red); }
.stat.bad small, .stat.bad b, .stat.bad em { color: var(--on-red); }
.stat.warn { background: var(--amber-soft); box-shadow: none; }
.stat.warn small, .stat.warn b, .stat.warn em { color: var(--amber-ink); }
.filters { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 500; min-height: 38px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: var(--on-pine); font-weight: 700; }
.chip i { font-style: normal; color: var(--red-ink); font-weight: 700; margin-left: 4px; }
.chip[aria-pressed="true"] i { color: inherit; }
.sel-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sel-row select, .sel-row input { border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; background: var(--surface); min-height: 42px; font-size: 16px; max-width: 100%; }
.sel-row input { flex: 1 1 170px; min-width: 0; }
.block { background: var(--surface); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; box-shadow: 0 1px 0 var(--line); min-width: 0; }
.block h2 { font-size: 15px; font-weight: 700; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; min-width: 0; }
.alert-item { display: flex; justify-content: space-between; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding-block: 8px; border-top: 1px solid var(--line); }
.alert-item:first-of-type { border-top: 0; }
.alert-item .sub { color: var(--muted); font-size: 13px; }
.tablebox { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; padding: 8px 12px; background: var(--sunken); white-space: nowrap; }
td { padding: 9px 12px; border-top: 1px solid var(--line); white-space: nowrap; }
tr.hot td { background: var(--red-soft); }
.mini-btn { min-height: 36px; padding: 3px 12px; font-size: 13px; }
/* シフト表 */
.grid-wrap { overflow: auto; max-height: 70dvh; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.shift { font-size: 12px; border-collapse: separate; border-spacing: 0; }
.shift thead th { position: sticky; top: 0; z-index: 2; }
.shift th, .shift td { padding: 5px 0; text-align: center; min-width: 30px; border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
.shift .nm, .shift .st { position: sticky; background: var(--surface); text-align: left; z-index: 1; border-left: 0; }
.shift .nm { left: 0; padding: 5px 10px; min-width: 104px; font-weight: 600; }
.shift .st { left: 104px; padding: 5px 10px; min-width: 112px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); box-shadow: 1px 0 0 var(--line); }
.shift thead .nm, .shift thead .st { z-index: 3; background: var(--sunken); }
.shift tfoot .nm, .shift tfoot .st { background: var(--sunken); }
.shift .nm small { display: none; font-weight: 400; color: var(--muted); font-size: 10px; }
.shift .today { background: var(--pine-soft); color: var(--pine-ink); font-weight: 700; }
.shift .wk { color: var(--muted); font-weight: 400; display: block; font-size: 10px; }
.m-休 { color: var(--muted); opacity: .55; }
.m-研, .m-M { color: var(--night); font-weight: 700; }
.m-在 { color: var(--amber-ink); font-weight: 700; }
.shift tfoot td { background: var(--sunken); font-weight: 600; }
.meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--pine); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.task-title { font-weight: 600; }
.note { color: var(--muted); font-size: 13px; }
.names { font-size: 13px; color: var(--muted); max-height: 130px; overflow: auto; }
.thumbs { display: flex; gap: 4px; }
.thumbs img { width: 44px; height: 33px; object-fit: cover; border-radius: 5px; background: var(--sunken); display: block; }
.sheet { max-width: 620px; }
.photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.photos figure { margin: 0; display: grid; gap: 4px; }
.photos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; background: var(--sunken); display: block; }
.photos figcaption { font-size: 13px; font-weight: 600; }
.hist-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.teams-card { border: 1px solid var(--line); border-left: 4px solid var(--night); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; font-size: 14px; background: var(--sunken); }
.teams-card .ch { font-size: 12px; color: var(--muted); }
.teams-card .open { justify-self: start; margin-top: 4px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; background: var(--surface); font-weight: 600; font-size: 13px; }
.check { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.check input { width: 20px; height: 20px; accent-color: var(--pine); }
/* 店舗登録 */
#storeMap { height: 250px; border-radius: 12px; background: var(--sunken); z-index: 0; }
.result { width: 100%; text-align: left; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; display: grid; gap: 1px; min-height: 44px; }
.result small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
#sfResults { display: grid; gap: 6px; max-height: 200px; overflow-y: auto; }
.search-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: 0; z-index: 8; height: auto; padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); flex-direction: row; flex-wrap: wrap; align-items: center; gap: 2px 4px; }
  .side .brand { padding: 0 4px; font-size: 17px; }
  .side .role { padding: 0 0 0 4px; font-size: 11px; }
  .side .navs { order: 3; flex: 1 0 100%; display: flex; overflow-x: auto; gap: 2px; scrollbar-width: none; min-width: 0; }
  .nav { width: auto; padding: 6px 10px; min-height: 40px; font-size: 13px; gap: 5px; }
  .nav .ic { display: none; }
  .nav .n { margin-left: 2px; line-height: 17px; min-width: 17px; padding: 0 4px; font-size: 10px; }
  .side .foot { margin: 0 0 0 auto; display: flex; }
  .proto-btn { padding: 3px 10px; min-height: 34px; font-size: 12px; }
  .proto-btn span.long { display: none; }
  /* スマホは氏名の下に登録店舗を出して、日付の列を広く見せる */
  .shift .st { display: none; }
  .shift .nm { box-shadow: 1px 0 0 var(--line); line-height: 1.3; max-width: 118px; white-space: normal; }
  .shift .nm small { display: block; }
}
@media (min-width: 861px) { .navs { display: grid; gap: 4px; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="content" id="content"></main>
</div>
<div id="overlay"></div>
<div id="toast" role="status" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../assets/core.js?v=5"></script>
<script>
(function () {
  'use strict';
  const K = window.Kyomo, esc = K.esc, fmt = K.fmt, ic = K.icon;
  const V = {
    page: 'today', f: { today: { area: 'all', pref: 'all' }, shift: { area: 'chugoku', pref: 'all' }, stores: { area: 'all', pref: 'all' }, stock: { area: 'all', pref: 'all' } },
    q: '', st: 'all', limit: 30, storeQ: '', storeLimit: 30, stockMonth: K.CUR_MONTH, stockStatus: 'all', stockEdit: false, stockLimit: 30,
    open: {}, draft: { type: 'task', title: '', due: '', body: '', err: '' }, sheet: null, person: null, form: null, backing: false
  };
  const $ = (id) => document.getElementById(id);
  const P = K.PEOPLE;
  const prefOf = (p) => { const h = K.homeStore(p); return h ? h.pref : p.pref; };
  const inFilter = (p, f) => (f.area === 'all' || p.area === f.area) && (f.pref === 'all' || prefOf(p) === f.pref);
  const over = () => P.filter((p) => K.status(p).key === 'over');
  const pending = () => over().filter((p) => !K.S.contacted[p.id]);
  const openFixes = () => K.S.fixes.filter((f) => f.state === 'open');
  const dateLabel = K.MONTH + '月' + K.TODAY + '日(' + K.weekday(K.TODAY) + ')';
  const homeName = (p) => { const h = K.homeStore(p); return h ? h.name : '移動型'; };
  let toastT;
  function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

  function renderSide() {
    const mk = K.CUR_MONTH;
    const wait = P.filter((p) => K.isTarget(mk, p.id) && (K.invOf(mk, p.id) || {}).status === 'wait').length;
    const nav = [['today', '今日の出勤', 'clock', pending().length + openFixes().length], ['shift', 'シフト', 'grid', 0], ['stores', '店舗', 'store', 0], ['stock', '棚卸し', 'box', wait], ['tasks', '提出物・お知らせ', 'list', 0], ['set', '設定', 'sliders', 0]];
    $('side').innerHTML = '<span class="brand">キョウモ</span><span class="role">管理者 ／ ' + esc(K.S.settings.company) + '</span><div class="navs">' +
      nav.map((n) => '<button class="nav" data-page="' + n[0] + '"' + (V.page === n[0] ? ' aria-current="page"' : '') + '>' + ic(n[2], 20) + n[1] + (n[3] ? '<span class="n num">' + n[3] + '</span>' : '') + '</button>').join('') +
      '</div><div class="foot"><button class="proto-btn" data-sheet="demo">' + ic('sliders', 16) + '<span>試作<span class="long">の操作</span></span></button></div>';
  }

  /* 地方のチップと県の選択。各画面で共通 */
  function regionFilter(key, allowAll, extra) {
    const f = V.f[key];
    const areas = K.areasInUse();
    const chips = (allowAll ? '<button class="chip" data-farea="all" data-fkey="' + key + '" aria-pressed="' + (f.area === 'all') + '">全地方</button>' : '') + areas.map((a) => {
      const c = key === 'today' ? pending().filter((p) => p.area === a.id).length : 0;
      return '<button class="chip" data-farea="' + a.id + '" data-fkey="' + key + '" aria-pressed="' + (f.area === a.id) + '">' + a.name + (c ? '<i class="num">' + c + '</i>' : '') + '</button>';
    }).join('');
    const prefs = K.prefsOf(f.area);
    const sel = '<select id="fpref" data-fkey="' + key + '" aria-label="県を選ぶ"><option value="all">すべての県</option>' + prefs.map((x) => '<option' + (f.pref === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select>';
    return '<div class="filters"><div class="chips" role="group" aria-label="地方">' + chips + '</div><div class="sel-row">' + sel + (extra || '') + '</div></div>';
  }

  function todayPage() {
    const f = V.f.today, list = P.filter((p) => inFilter(p, f)), shift = list.filter(K.needsPunch);
    const inNow = shift.filter((p) => K.rec(p).in != null);
    const ov = list.filter((p) => K.status(p).key === 'over');
    const check = shift.filter((p) => { const r = K.rec(p); return r.in != null && r.loc !== 'in'; });
    const help = shift.filter(K.isHelp);
    const dl = fmt(K.S.settings.deadline);
    let h = '<div class="head"><h1>今日の出勤</h1><span class="meta num">' + dateLabel + ' ' + fmt(K.now()) + (K.isTest() ? '（テスト時刻）' : '') + ' 時点 ／ 判定 ' + dl + '</span></div>';
    h += regionFilter('today', true, '<input id="q" type="search" placeholder="名前や店舗で探す" value="' + esc(V.q) + '" aria-label="名前や店舗で探す"><select id="st" aria-label="状態で絞り込む">' + [['all', 'すべての状態'], ['over', '未出勤'], ['check', '位置の要確認'], ['help', '応援'], ['in', '勤務中'], ['before', '出勤前'], ['off', '休み・在宅']].map((o) => '<option value="' + o[0] + '"' + (V.st === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select><button class="btn" id="csv">CSV出力</button>');
    h += '<div class="stats"><div class="stat"><small>シフト</small><b class="num">' + shift.length + '</b><em>人</em></div><div class="stat"><small>出勤済み</small><b class="num">' + inNow.length + '</b><em>人</em></div>' +
      '<div class="stat' + (ov.length ? ' bad' : '') + '"><small>未出勤</small><b class="num">' + ov.length + '</b><em>人</em></div><div class="stat' + (check.length ? ' warn' : '') + '"><small>位置の要確認</small><b class="num">' + check.length + '</b><em>人</em></div><div class="stat"><small>応援</small><b class="num">' + help.length + '</b><em>人</em></div></div>';
    if (ov.length) {
      h += '<section class="block"><h2>対応が必要な人（' + dl + '時点で出勤記録なし）</h2>' + ov.sort((a, b) => (K.S.contacted[a.id] ? 1 : 0) - (K.S.contacted[b.id] ? 1 : 0)).map((p) => '<div class="alert-item"><div><b>' + esc(p.name) + '</b><div class="sub">' + esc(prefOf(p)) + ' ／ ' + esc(homeName(p)) + ' ／ ' + esc(p.role) + '</div></div>' + (K.S.contacted[p.id] ? '<span class="pill idle">連絡済み</span>' : '<button class="btn" data-contact="' + p.id + '">連絡済みにする</button>') + '</div>').join('') + '</section>';
    }
    const fixes = openFixes();
    if (fixes.length) {
      h += '<section class="block"><h2>打刻の修正依頼</h2>' + fixes.map((x) => '<div class="alert-item"><div><b>' + esc(K.byId[x.pid].name) + '</b>　' + esc(x.date) + ' ' + esc(x.kind) + '<div class="sub">' + esc(x.detail) + '</div></div><button class="btn" data-fixok="' + esc(x.id) + '">承認する</button></div>').join('') + '</section>';
    }
    h += '<div id="tableArea"></div>';
    return h;
  }
  const rank = { over: 0, before: 1, late: 2, in: 3, left: 4, off: 5 };
  function filtered() {
    const q = V.q.trim().replace(/\s/g, ''), f = V.f.today;
    return P.filter((p) => inFilter(p, f)).filter((p) => {
      const st = K.status(p).key, r = K.rec(p), site = K.siteOf(p);
      if (V.st === 'check' && !(r.in != null && r.loc !== 'in')) return false;
      if (V.st === 'help' && !K.isHelp(p)) return false;
      if (V.st === 'in' && !(st === 'in' || st === 'late')) return false;
      if ((V.st === 'over' || V.st === 'before' || V.st === 'off') && st !== V.st) return false;
      return !q || (p.name + homeName(p) + (site ? site.name : '')).replace(/\s/g, '').includes(q);
    }).sort((a, b) => rank[K.status(a).key] - rank[K.status(b).key]);
  }
  function renderTable() {
    const el = $('tableArea');
    if (!el) return;
    const rows = filtered(), show = rows.slice(0, V.limit);
    el.innerHTML = '<div class="tablebox"><table><thead><tr><th>スタッフ</th><th>県</th><th>登録店舗</th><th>打刻した店舗</th><th>出勤</th><th>退勤</th><th>位置</th><th>状態</th></tr></thead><tbody>' + (show.map((p) => {
      const r = K.rec(p), st = K.status(p), site = r.storeId ? K.store(r.storeId) : null;
      return '<tr' + (st.key === 'over' ? ' class="hot"' : '') + '><td><b>' + esc(p.name) + '</b></td><td>' + esc(prefOf(p)) + '</td><td>' + esc(homeName(p)) + '</td><td>' + (site ? esc(site.name) + (K.isHelp(p) ? ' <span class="pill warn">応援</span>' : '') : '—') + '</td><td class="num">' + (r.in != null ? fmt(r.in) : '—') + '</td><td class="num">' + (r.out != null ? fmt(r.out) : '—') + '</td><td>' + (r.loc ? '<span class="pill ' + K.locInfo(r.loc).pill + '">' + esc(K.locInfo(r.loc).short) + '</span>' : '—') + '</td><td><span class="pill ' + st.pill + '">' + esc(st.label) + '</span></td></tr>';
    }).join('') || '<tr><td colspan="8" class="muted">条件に合う人はいません。</td></tr>') + '</tbody></table></div>' +
      '<div class="row" style="margin-top:8px"><span class="note num">' + rows.length + '人中 ' + show.length + '人を表示</span>' + (rows.length > V.limit ? '<button class="btn" data-more="1">さらに30人表示</button>' : '') + '</div>';
  }

  function shiftPage() {
    const f = V.f.shift, list = P.filter((p) => inFilter(p, f));
    const days = Array.from({ length: K.DAYS }, (_, i) => i + 1);
    let h = '<div class="head"><h1>シフト</h1><span class="meta">' + K.YEAR + '年' + K.MONTH + '月 ／ ' + list.length + '人</span></div>' + regionFilter('shift', false);
    if (!list.length) return h + '<section class="block"><p class="note">この条件のスタッフはいません。</p></section>';
    h += '<div class="grid-wrap"><table class="shift"><thead><tr><th class="nm">氏名</th><th class="st">登録店舗</th>' + days.map((d) => '<th class="' + (d === K.TODAY ? 'today' : '') + '">' + d + '<span class="wk">' + K.weekday(d) + '</span></th>').join('') + '</tr></thead><tbody>' +
      list.map((p) => '<tr><td class="nm">' + esc(p.name) + '<small>' + esc(homeName(p)) + '</small></td><td class="st">' + esc(homeName(p)) + '</td>' + days.map((d) => { const m = p.marks[d - 1]; return '<td class="m-' + m + (d === K.TODAY ? ' today' : '') + '">' + m + '</td>'; }).join('') + '</tr>').join('') +

  function storeSheet() {
    const F = V.form;
    const prefs = Object.keys(K.PREF_AREA).map((x) => '<option' + (F.pref === x ? ' selected' : '') + '>' + x + '</option>').join('');
    return '<div class="sheet-back" data-close="1"></div><div class="sheet" role="dialog" aria-label="店舗の登録"><h2>' + (F.id ? '店舗の位置を確認' : '店舗を追加') + '</h2>' +
      '<div class="field"><label for="sfQ">店舗名、住所、Googleマップのリンクのどれかを入れてください</label><div class="search-row"><input id="sfQ" placeholder="例: エディオン山口本店" autocomplete="off"><button class="btn primary" id="sfSearch" type="button">探す</button></div></div>' +
      '<button class="btn" id="sfHere" type="button">' + ic('pin', 18) + '今いる場所を使う</button>' +
      '<div id="sfMsg" class="err" hidden></div><div id="sfResults"></div>' +
      '<div id="storeMap"></div><p class="note" id="sfPos"></p>' +
      '<div class="two"><div class="field"><label for="sfName">店舗名</label><input id="sfName" value="' + esc(F.name) + '"></div><div class="field"><label for="sfPref">都道府県</label><select id="sfPref"><option value="">選択してください</option>' + prefs + '</select></div></div>' +
      '<p class="note">地図のピンは動かせます。売り場の入口付近に合わせると、判定が安定します。登録した内容はこの端末にだけ保存します。</p>' +
      '<div id="sfErr" class="err" hidden></div>' +
      '<button class="btn primary" id="sfSave" type="button" style="min-height:50px">この内容で保存する</button>' +
      (F.id ? '<button class="btn" id="sfDelete" type="button">この店舗を削除する</button>' : '') + '<button class="btn" data-close="1" type="button">閉じる</button></div>';
  }
  let map = null, marker = null, circle = null;
  function posText() {
    const F = V.form, el = $('sfPos');
    if (!el) return;
    el.textContent = F.lat != null ? '位置 ' + F.lat.toFixed(5) + ', ' + F.lng.toFixed(5) + ' ／ 判定の範囲 ' + K.S.settings.radius + 'm' : 'まだ位置が決まっていません。上で店舗を探してください。';
  }
  function setPos(lat, lng, zoom) {
    const F = V.form;
    F.lat = lat; F.lng = lng; posText();
    if (!window.L || !map) return;
    const ll = [lat, lng];
    if (!marker) {
      marker = L.marker(ll, { draggable: true, icon: L.divIcon({ className: '', html: '<div style="width:22px;height:22px;border-radius:50%;background:#C2331E;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(map);
      marker.on('dragend', () => { const p = marker.getLatLng(); setPos(p.lat, p.lng); });
      circle = L.circle(ll, { radius: K.S.settings.radius, color: '#0E6650', weight: 2, fillOpacity: 0.12 }).addTo(map);
    } else { marker.setLatLng(ll); circle.setLatLng(ll); }
    map.setView(ll, zoom || map.getZoom());
  }
  function openStoreForm(s) {
    V.form = s ? { id: s.id, name: s.name, pref: s.pref, lat: s.lat, lng: s.lng } : { id: null, name: '', pref: '', lat: null, lng: null };
    V.sheet = 'store';
    map = marker = circle = null;
    $('overlay').innerHTML = storeSheet();
    posText();
    if (window.L) {
      const c = s ? [s.lat, s.lng] : [36.2, 137.5];
      map = L.map('storeMap', { scrollWheelZoom: false }).setView(c, s ? 16 : 5);
      L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>' }).addTo(map);
      map.on('click', (e) => setPos(e.latlng.lat, e.latlng.lng));
      if (s) setPos(s.lat, s.lng, 16);
      setTimeout(() => map && map.invalidateSize(), 260);
    } else {
      $('storeMap').innerHTML = '<p class="note" style="padding:14px">地図を読み込めませんでした。位置の検索とリンクの貼り付けは使えます。</p>';
    }
  }
  function sfMessage(t) { const m = $('sfMsg'); if (m) { m.textContent = t || ''; m.hidden = !t; } }
  async function searchStore() {
    const q = $('sfQ').value.trim(), box = $('sfResults');
    sfMessage(''); box.innerHTML = '';
    if (!q) { sfMessage('店舗名、住所、Googleマップのリンクのどれかを入れてください。'); return; }
    const parsed = K.parseLatLng(q);
    if (parsed && parsed.short) { sfMessage('スマホの共有用の短いリンクは読み取れません。PCのブラウザの上に出るURLを貼るか、店舗名で探してください。'); return; }
    if (parsed) { setPos(parsed.lat, parsed.lng, 17); return; }
    box.innerHTML = '<p class="note">探しています。</p>';
    const out = [];
    const [osm, gsi] = await Promise.allSettled([
      fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=jp&accept-language=ja&q=' + encodeURIComponent(q)).then((r) => r.json()),
      fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q)).then((r) => r.json())
    ]);
    if (osm.status === 'fulfilled' && Array.isArray(osm.value)) osm.value.forEach((x) => out.push({ name: x.name || String(x.display_name).split(',')[0], addr: x.display_name, lat: +x.lat, lng: +x.lon, src: 'OpenStreetMap' }));
    if (gsi.status === 'fulfilled' && Array.isArray(gsi.value)) gsi.value.slice(0, 5).forEach((x) => out.push({ name: x.properties.title, addr: x.properties.title, lat: x.geometry.coordinates[1], lng: x.geometry.coordinates[0], src: '国土地理院' }));
    V.results = out;
    if (!out.length) {
      box.innerHTML = '';
      sfMessage(osm.status === 'rejected' && gsi.status === 'rejected' ? '検索につながりませんでした。少し待ってやり直してください。' : '見つかりませんでした。住所で探すか、Googleマップのリンクを貼ってください。');
      return;
    }
    box.innerHTML = out.map((x, i) => '<button class="result" type="button" data-result="' + i + '"><span>' + esc(x.name) + '</span><small>' + esc(x.addr) + '（' + x.src + '）</small></button>').join('');
  }

  function stockPage() {
    const f = V.f.stock, mk = V.stockMonth, cur = mk === K.CUR_MONTH;
    const inScope = P.filter((p) => inFilter(p, f));
    const target = inScope.filter((p) => K.isTarget(mk, p.id));

    let h = '<div class="head"><h1>棚卸し</h1><span class="meta">' + K.monthLabel(mk) + '分' + (cur ? ' ／ 締切 ' + K.stockDue : '') + '</span></div>';
    h += '<div class="chips" role="group" aria-label="月">' + [0, 1, 2].map((b) => { const m = K.monthKey(b); return '<button class="chip" data-month="' + m + '" aria-pressed="' + (mk === m) + '">' + K.monthLabel(m) + '</button>'; }).join('') + '</div>';
    h += regionFilter('stock', true, '<select id="stockStatus" aria-label="状況で絞り込む">' + [['all', 'すべての状況'], ['wait', '確認待ち'], ['none', '未提出'], ['back', '差し戻し'], ['ok', '確認済み'], ['diff', '貸与数と差異あり']].map((o) => '<option value="' + o[0] + '"' + (V.stockStatus === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>');
    h += '<div class="stats"><div class="stat"><small>対象</small><b class="num">' + target.length + '</b><em>人</em></div><div class="stat' + (cnt('wait') ? ' warn' : '') + '"><small>確認待ち</small><b class="num">' + cnt('wait') + '</b><em>人</em></div><div class="stat"><small>確認済み</small><b class="num">' + cnt('ok') + '</b><em>人</em></div><div class="stat"><small>差し戻し</small><b class="num">' + cnt('back') + '</b><em>人</em></div><div class="stat"><small>未提出</small><b class="num">' + none.length + '</b><em>人</em></div><div class="stat' + (diff.length ? ' bad' : '') + '"><small>差異あり</small><b class="num">' + diff.length + '</b><em>人</em></div></div>';
    h += '<div class="sel-row"><button class="btn" id="stockEdit">' + (V.stockEdit ? '対象者の変更を終わる' : '今月の対象者を変更') + '</button>' + (cur && !V.stockEdit && !K.S.reminded.stock ? '<button class="btn" id="remindAll">未提出の人に催促する</button>' : '') + (K.S.reminded.stock && cur ? '<span class="pill idle">催促済み</span>' : '') + '</div>';
    if (V.stockEdit) {
      const list = inScope.slice(0, V.stockLimit);
      h += '<section class="block"><div class="row"><h2>' + K.monthLabel(mk) + 'の対象者（絞り込み中 ' + inScope.length + '人）</h2><div class="sel-row"><button class="btn mini-btn" data-allt="1">全員を対象にする</button><button class="btn mini-btn" data-allt="0">全員を対象から外す</button></div></div><div class="tablebox"><table><thead><tr><th>対象</th><th>スタッフ</th><th>県</th><th>登録店舗</th></tr></thead><tbody>' + list.map((p) => '<tr><td><label class="check"><input type="checkbox" data-tg="' + p.id + '"' + (K.isTarget(mk, p.id) ? ' checked' : '') + ' aria-label="' + esc(p.name) + 'を対象にする"></label></td><td><b>' + esc(p.name) + '</b></td><td>' + esc(prefOf(p)) + '</td><td>' + esc(homeName(p)) + '</td></tr>').join('') + '</tbody></table></div>' + (inScope.length > V.stockLimit ? '<button class="btn" data-stockmore="1">さらに表示</button>' : '') + '</section>';
      return h;
    }
    const order = { wait: 0, back: 1, none: 2, ok: 3 };
    const filteredRows = rows.filter((x) => { const s = x.inv ? x.inv.status : 'none'; if (V.stockStatus === 'all') return true; if (V.stockStatus === 'diff') return x.inv && x.inv.miss.length; return s === V.stockStatus; }).sort((a, b) => order[a.inv ? a.inv.status : 'none'] - order[b.inv ? b.inv.status : 'none']);
    const show = filteredRows.slice(0, V.stockLimit);
    h += '<div class="tablebox"><table><thead><tr><th>スタッフ</th><th>県</th><th>登録店舗</th><th>状況</th><th>提出日</th><th>写真</th><th>貸与数との差異</th><th></th></tr></thead><tbody>' + (show.map((x) => {
      const s = x.inv ? K.INV_STATUS[x.inv.status] : { label: '未提出', pill: 'idle' };
      const thumbs = x.inv ? '<div class="thumbs">' + K.PHOTO_SLOTS.map((sl) => '<img alt="' + sl.n + '" data-photo="' + esc(x.inv.photos[sl.k] || 'sample') + '" data-key="' + x.p.id + sl.k + '" data-label="' + sl.n + '">').join('') + '</div>' : '—';
      return '<tr><td><b>' + esc(x.p.name) + '</b></td><td>' + esc(prefOf(x.p)) + '</td><td>' + esc(homeName(x.p)) + '</td><td><span class="pill ' + s.pill + '">' + s.label + '</span></td><td class="num">' + (x.inv ? esc(x.inv.date) : '—') + '</td><td>' + thumbs + '</td><td>' + (x.inv && x.inv.miss.length ? '<span class="pill bad">あり</span>' : (x.inv ? 'なし' : '—')) + '</td><td><button class="btn mini-btn" data-person="' + x.p.id + '">開く</button></td></tr>';
    }).join('') || '<tr><td colspan="8" class="muted">条件に合う人はいません。</td></tr>') + '</tbody></table></div><div class="row"><span class="note num">' + filteredRows.length + '人中 ' + show.length + '人を表示</span>' + (filteredRows.length > V.stockLimit ? '<button class="btn" data-stockmore="1">さらに30人表示</button>' : '') + '</div>';
    return h;
  }

    h += '<div class="hist-chips" aria-label="月を切り替える">' + [0, 1, 2].map((b) => { const m = K.monthKey(b), t = K.isTarget(m, pid), i = K.invOf(m, pid); return '<button class="chip" data-pmonth="' + m + '" aria-pressed="' + (m === mk) + '">' + K.monthLabel(m) + '：' + (!t ? '対象外' : i ? K.INV_STATUS[i.status].label : '未提出') + '</button>'; }).join('') + '</div>';

    const sampleP = P[5];
    return '<div class="head"><h1>設定</h1></div><section class="block"><h2>会社</h2><div class="field"><label for="setCompany">会社名</label><input id="setCompany" value="' + esc(t.company) + '"></div></section>' +
      '<section class="block"><h2>出勤の確認</h2><div class="two"><div class="field"><label for="setDl">判定時刻</label><input id="setDl" type="time" value="' + fmt(t.deadline) + '"></div><div class="field"><label for="setTarget">アラートの送り先</label><select id="setTarget">' + [['both', '本人と管理者'], ['admin', '管理者のみ'], ['staff', '本人のみ']].map((o) => '<option value="' + o[0] + '"' + (t.target === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div><div class="field"><label for="setRadius">店舗とみなす範囲</label><select id="setRadius">' + [100, 200, 300, 500].map((v) => '<option value="' + v + '"' + (t.radius === v ? ' selected' : '') + '>' + v + 'm以内</option>').join('') + '</select></div></div><p class="note">シフトがある人のうち、判定時刻までに出勤の記録がない人をアラートの対象にします。休みと在宅の人は対象外です。</p></section>' +
      '<section class="block"><h2>Microsoft Teams連携</h2><p class="note">この試作では見た目の確認だけで、Teamsにはまだ送信しません。</p><div class="field"><label for="setCh">送信先のチャネル名</label><input id="setCh" value="' + esc(tm.channel) + '"></div><label class="check"><input type="checkbox" data-tm="stock"' + (tm.stock ? ' checked' : '') + '>棚卸しの提出を知らせる</label><label class="check"><input type="checkbox" data-tm="diff"' + (tm.diff ? ' checked' : '') + '>貸与数との差異を目立たせる</label><label class="check"><input type="checkbox" data-tm="alert"' + (tm.alert ? ' checked' : '') + '>未出勤アラートを知らせる</label>' + teamsCard(K.CUR_MONTH, sampleP, { miss: [] }) + '</section>' +
      '<section class="block"><h2>相談窓口</h2><div class="field"><label for="setInner">社内の窓口の連絡先</label><input id="setInner" value="' + esc(t.inner) + '"></div><div class="field"><label for="setOuter">社外の窓口の連絡先</label><input id="setOuter" value="' + esc(t.outer) + '"></div><p class="note">管理者が設定するのは連絡先だけです。誰が相談したか、何を相談したかは、このアプリには残りません。</p></section>';
  }

  function demoSheet() {
    return '<div class="sheet-back" data-close="1"></div><div class="sheet" role="dialog" aria-label="試作の操作"><h2>試作の操作</h2><div class="field"><span class="lab">時刻 <span class="num">' + fmt(K.now()) + '</span>' + (K.isTest() ? '（テスト中）' : '（実際の時刻）') + '</span><div class="jump-row">' + [[592, '09:52'], [616, '10:16'], [1141, '19:01']].map((j) => '<button class="btn num" data-jump="' + j[0] + '">' + j[1] + '</button>').join('') + (K.isTest() ? '<button class="btn primary" data-jump="real">実際の時刻に戻す</button>' : '') + '</div></div><a class="btn" href="../" style="text-decoration:none">' + ic('clock', 18) + 'スタッフアプリを開く</a><button class="btn" data-reset="1">最初の状態に戻す</button><p class="proto">試作版 5 ／ データは架空のサンプルで、この端末の中だけに保存します。地図：地理院タイル、OpenStreetMap。</p><button class="btn primary" data-close="1">閉じる</button></div>';
  }

  function renderOverlay() {
    if (V.sheet === 'demo') $('overlay').innerHTML = demoSheet();
    else if (V.sheet === 'person') { $('overlay').innerHTML = personSheet(); K.hydratePhotos($('overlay')); }
    else if (V.sheet !== 'store') $('overlay').innerHTML = '';
  }
  function render() {
    renderSide();
    $('content').innerHTML = ({ today: todayPage, shift: shiftPage, stores: storesPage, stock: stockPage, tasks: tasksPage, set: setPage }[V.page])();
    if (V.page === 'today') renderTable();
    K.hydratePhotos($('content'));
    renderOverlay();
  }
  function openPerson(mk, pid) {
    V.person = { mk, pid }; V.sheet = 'person'; V.backing = false;
    try { history.replaceState(null, '', '#stock/' + mk + '/' + pid); } catch (e) { /* 無視 */ }
    renderOverlay();
  }
  function closeSheet() {
    if (V.sheet === 'store' && map) { map.remove(); map = marker = circle = null; }
    if (V.sheet === 'person') { try { history.replaceState(null, '', location.pathname); } catch (e) { /* 無視 */ } }
    V.sheet = null; V.person = null; V.form = null; V.backing = false;
    $('overlay').innerHTML = '';
  }
  function routeFromHash() {
    const m = /^#stock\/(\d{4}-\d{1,2})\/([\w-]+)$/.exec(location.hash);
    if (m && K.byId[m[2]]) { V.page = 'stock'; V.stockMonth = m[1]; render(); openPerson(m[1], m[2]); return true; }
    return false;
  }

  function csv() {
    const rows = [['氏名', '地方', '県', '登録店舗', '打刻した店舗', '応援', '役職', 'シフト', '出勤', '退勤', '位置', '状態']].concat(filtered().map((p) => {
      const r = K.rec(p), site = r.storeId ? K.store(r.storeId) : null;
      return [p.name, K.area(p.area).name, prefOf(p), homeName(p), site ? site.name : '', K.isHelp(p) ? '応援' : '', p.role, p.today, r.in != null ? fmt(r.in) : '', r.out != null ? fmt(r.out) : '', r.loc ? K.locInfo(r.loc).short : '', K.status(p).label];
    }));
    const text = '﻿' + rows.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
    a.download = 'kyomo-attendance-sample.csv';
    document.body.appendChild(a); a.click(); a.remove();
    toast('CSVを出力しました');
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button, [data-close]');
    if (!b) return;
    const d = b.dataset;
    if (d.page) { V.page = d.page; window.scrollTo(0, 0); render(); return; }
    if (d.farea) { const f = V.f[d.fkey]; f.area = d.farea; f.pref = 'all'; V.limit = 30; V.stockLimit = 30; V.storeLimit = 30; render(); return; }
    if (d.more) { V.limit += 30; renderTable(); return; }
    if (d.storemore) { V.storeLimit += 30; render(); return; }
    if (d.stockmore) { V.stockLimit += 30; render(); return; }
    if (d.contact) { K.S.contacted[d.contact] = true; K.save(); render(); return; }
    if (d.fixok) { const x = K.S.fixes.find((y) => y.id === d.fixok); if (x) x.state = 'done'; K.save(); render(); toast('修正を承認しました'); return; }
    if (d.toggle) { V.open[d.toggle] = !V.open[d.toggle]; render(); return; }
    if (d.sheet === 'demo') { V.sheet = 'demo'; renderOverlay(); return; }
    if (d.close) { closeSheet(); render(); return; }
    if (d.jump) { if (d.jump === 'real') K.setReal(); else K.setNow(+d.jump); closeSheet(); render(); return; }
    if (d.reset) { K.reset(); closeSheet(); render(); toast('最初の状態に戻しました'); return; }
    if (b.id === 'csv') { csv(); return; }
    if (b.id === 'remindAll') { K.S.reminded.stock = true; K.save(); render(); toast('未提出の人に催促を送りました'); return; }
    if (b.id === 'addStore') { openStoreForm(null); return; }
    if (d.editstore) { openStoreForm(K.store(d.editstore)); return; }
    if (b.id === 'sfSearch') { searchStore(); return; }
    if (b.id === 'sfHere') {
      sfMessage('');
      if (!navigator.geolocation) { sfMessage('この端末では位置情報を使えません。'); return; }
      navigator.geolocation.getCurrentPosition((pos) => setPos(pos.coords.latitude, pos.coords.longitude, 17), () => sfMessage('位置を取得できませんでした。スマホの設定で、ブラウザの位置情報を許可してください。'), { enableHighAccuracy: true, timeout: 9000, maximumAge: 0 });
      return;
    }
    if (d.result !== undefined) {
      const x = V.results[+d.result], F = V.form;
      if (!$('sfName').value.trim()) { $('sfName').value = x.name; F.name = x.name; }
      const pref = K.prefFromText(x.addr);
      if (pref) { $('sfPref').value = pref; F.pref = pref; }
      setPos(x.lat, x.lng, 17);
      $('sfResults').innerHTML = '';
      return;
    }
    if (b.id === 'sfSave') {
      const F = V.form, name = $('sfName').value.trim(), pref = $('sfPref').value, err = $('sfErr');
      const msg = !name ? '店舗名を入れてください。' : !pref ? '都道府県を選んでください。' : F.lat == null ? '店舗の位置を決めてください。' : '';
      if (msg) { err.textContent = msg; err.hidden = false; return; }
      const data = { name, pref, area: K.PREF_AREA[pref], lat: F.lat, lng: F.lng };
      if (F.id) K.updateStore(F.id, data); else K.addStore(data);
      closeSheet(); render(); toast('店舗を保存しました'); return;
    }
    if (b.id === 'sfDelete') { K.removeStore(V.form.id); closeSheet(); render(); toast('店舗を削除しました'); return; }
    if (d.month) { V.stockMonth = d.month; V.stockEdit = false; V.stockLimit = 30; render(); return; }
    if (b.id === 'stockEdit') { V.stockEdit = !V.stockEdit; V.stockLimit = 30; render(); return; }
    if (d.allt !== undefined) { P.filter((p) => inFilter(p, V.f.stock)).forEach((p) => K.setTarget(V.stockMonth, p.id, d.allt === '1')); render(); toast(d.allt === '1' ? '全員を対象にしました' : '全員を対象から外しました'); return; }
    if (d.person) { openPerson(V.stockMonth, d.person); return; }
    if (d.pmonth) { openPerson(d.pmonth, V.person.pid); return; }
    if (b.id === 'invOk') { const { mk, pid } = V.person; K.setInv(mk, pid, Object.assign({}, K.invOf(mk, pid), { status: 'ok', backNote: '' })); render(); toast('確認済みにしました'); return; }
    if (b.id === 'invBack') { V.backing = true; renderOverlay(); return; }
    if (b.id === 'cancelBack') { V.backing = false; renderOverlay(); return; }
    if (b.id === 'sendBack') {
      const note = $('backNote').value.trim();
      if (!note) { const er = $('backErr'); er.textContent = '差し戻しの理由を入れてください。'; er.hidden = false; return; }
      const { mk, pid } = V.person;
      K.setInv(mk, pid, Object.assign({}, K.invOf(mk, pid), { status: 'back', backNote: note }));
      V.backing = false; render(); toast('差し戻しました'); return;
    }
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'postForm') return;
    e.preventDefault();
    const d = V.draft;
    if (!d.title.trim()) { d.err = '件名を入れてください。'; render(); return; }
    if (d.type === 'task' && !d.due.trim()) { d.err = '提出物には締切を入れてください。'; render(); return; }
    const id = 'p' + Date.now();
    if (d.type === 'task') K.S.posted.tasks.unshift({ id, title: d.title.trim(), body: d.body.trim() || '内容を確認して、提出してください。', due: d.due.trim(), ratio: 0 });
    else K.S.posted.notices.unshift({ id, title: d.title.trim(), body: d.body.trim() || '内容を確認してください。', date: K.md(0), ratio: 0, important: false });
    K.save();
    V.draft = { type: d.type, title: '', due: '', body: '', err: '' };
    render(); toast('全員に配信しました');
  });
  document.addEventListener('input', (e) => {
    const t = e.target, s = K.S.settings;
    if (t.id === 'q') { V.q = t.value; V.limit = 30; renderTable(); }
    if (t.id === 'storeQ') {
      V.storeQ = t.value;
      const pos = t.selectionStart; render();
      const n = $('storeQ'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) { /* 無視 */ } }
    }
    if (t.id === 'nTitle') V.draft.title = t.value;
    if (t.id === 'nDue') V.draft.due = t.value;
    if (t.id === 'nBody') V.draft.body = t.value;
    if (t.id === 'setCompany') { s.company = t.value; K.save(); renderSide(); }
    if (t.id === 'setInner') { s.inner = t.value; K.save(); }
    if (t.id === 'setOuter') { s.outer = t.value; K.save(); }
    if (t.id === 'setCh') { s.teams.channel = t.value; K.save(); }
  });
  document.addEventListener('change', (e) => {
    const t = e.target, s = K.S.settings, d = t.dataset;
    if (t.id === 'fpref') { V.f[d.fkey].pref = t.value; V.limit = 30; V.stockLimit = 30; V.storeLimit = 30; render(); }
    if (t.id === 'st') { V.st = t.value; V.limit = 30; renderTable(); }
    if (t.id === 'stockStatus') { V.stockStatus = t.value; V.stockLimit = 30; render(); }
    if (t.id === 'nType') V.draft.type = t.value;
    if (t.id === 'setDl') { const m = K.parseTime(t.value); if (m != null) { s.deadline = m; K.save(); renderSide(); } }
    if (t.id === 'setTarget') { s.target = t.value; K.save(); }
    if (t.id === 'setRadius') { s.radius = +t.value; K.save(); }
    if (d.tg) { K.setTarget(V.stockMonth, d.tg, t.checked); }
    if (d.tm) { s.teams[d.tm] = t.checked; K.save(); }
  });
  window.addEventListener('hashchange', routeFromHash);
  const activeIsForm = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); };
  let last = K.nowMin();
  setInterval(() => {
    const m = K.nowMin();
    if (m !== last) { last = m; if (!activeIsForm() && !V.sheet) render(); }
  }, 1000);
  K.onChange(() => { if (!activeIsForm() && !V.sheet) render(); });
  if (!routeFromHash()) render();
})();
</script>
</body>
</html>
