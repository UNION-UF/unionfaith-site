<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B4A3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="キョウモ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>キョウモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@900&display=swap">
<link rel="stylesheet" href="assets/base.css?v=2">
<style>
/* 親指が届く下端に打刻ボタンを固定し、上半分は「いま何時か、今日どこか」だけを見せる */
#app { max-width: 480px; margin: 0 auto; min-height: 100dvh; background: var(--bg); position: relative; }
.top { background: var(--pine-deep); color: var(--on-deep); padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
.bar .brand { font-size: 18px; }
.demo-btn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid rgba(255, 255, 255, .28); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--on-deep); min-height: 34px; }
.sub-title { font-family: var(--display); font-weight: 900; font-size: 21px; margin-top: 4px; }
.when { color: var(--on-deep-muted); font-size: 13px; margin-top: 6px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.clock { display: flex; align-items: baseline; gap: 6px; font-weight: 600; line-height: 1; margin-top: 8px; letter-spacing: .01em; }
.clock b { font-size: clamp(60px, 19vw, 74px); font-weight: 600; }
.clock span { font-size: 24px; color: var(--on-deep-muted); }
.main { padding: 14px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
.main.home { padding-bottom: calc(192px + env(safe-area-inset-bottom, 0px)); }
.main.page { padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
.card { background: var(--surface); border-radius: 14px; padding: 13px 14px; display: grid; gap: 6px; min-width: 0; box-shadow: 0 1px 0 var(--line); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-width: 0; }
.today-site { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.alarm { background: var(--red); color: var(--on-red); border-radius: 14px; padding: 13px 14px; display: grid; gap: 3px; }
.alarm b { font-size: 15px; }
.alarm span { font-size: 13px; }
.times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.time-cell { background: var(--surface); border-radius: 14px; padding: 11px 14px; box-shadow: 0 1px 0 var(--line); min-width: 0; }
.time-cell small { display: block; color: var(--muted); font-size: 12px; }
.time-cell b { font-size: 26px; font-weight: 600; line-height: 1.25; }
.loc-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.linkcard { width: 100%; text-align: left; background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: 0 1px 0 var(--line); min-height: 54px; }
/* 打刻ドック */
.dock { position: fixed; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 78%, transparent); padding: 18px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; z-index: 10; }
.punch { border-radius: 18px; min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--display); font-weight: 900; font-size: 24px; transition: transform .08s; position: relative; }
.punch small { font-family: var(--sans); font-weight: 500; font-size: 12px; opacity: .9; }
.punch:active:not(:disabled) { transform: scale(.97); }
.punch.in.on { background: var(--pine); color: var(--on-pine); box-shadow: var(--shadow); }
.punch.out.on { background: var(--night); color: var(--on-night); box-shadow: var(--shadow); }
.punch:disabled { background: var(--surface); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); cursor: default; font-size: 20px; }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid currentColor; border-right-color: transparent; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
/* タブ */
.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; background: var(--surface); box-shadow: 0 -1px 0 var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px max(4px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); z-index: 11; }
.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 52px; color: var(--muted); font-size: 11px; font-weight: 500; position: relative; border-radius: 10px; }
.tabs button[aria-current="page"] { color: var(--pine-ink); font-weight: 700; }
.tabs .dot { position: absolute; top: 3px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: var(--on-red); font-size: 10px; line-height: 16px; text-align: center; }
/* 下位ページ */
.page-title { font-family: var(--display); font-weight: 900; font-size: 21px; }
.section-label { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 4px; }
.task { width: 100%; text-align: left; }
.task b { font-size: 15px; }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--on-deep); font-weight: 600; min-height: 40px; }
.step-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--line); }
.step-row:last-child { border-bottom: 0; }
.steps { display: flex; align-items: center; gap: 4px; }
.steps button { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--sunken); font-size: 20px; }
.steps span { width: 34px; text-align: center; font-size: 18px; font-weight: 600; }
.diff { color: var(--red-ink); font-size: 12px; font-weight: 600; display: block; }
.summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.summary div { background: var(--surface); border-radius: 12px; padding: 10px; box-shadow: 0 1px 0 var(--line); }
.summary small { display: block; color: var(--muted); font-size: 11px; }
.summary b { font-size: 22px; font-weight: 600; }
.hist-row { display: grid; grid-template-columns: 62px 1fr auto; gap: 8px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
.hist-row:last-child { border-bottom: 0; }
.safe { background: var(--pine-soft); color: var(--pine-ink); border-radius: 14px; padding: 14px; display: grid; gap: 4px; font-size: 14px; }
.safe b { font-family: var(--display); font-weight: 900; font-size: 17px; }
.contact { font-weight: 700; overflow-wrap: anywhere; }
.bullets { margin: 0; padding-left: 1.2em; display: grid; gap: 5px; font-size: 14px; }
/* 通知とスナックバー */
.banner { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: calc(100% - 20px); max-width: 460px; background: var(--surface); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); z-index: 30; display: grid; gap: 2px; animation: drop .25s ease-out; }
.banner b { display: flex; align-items: center; gap: 6px; color: var(--red-ink); font-size: 14px; }
.banner span { font-size: 13px; }
@keyframes drop { from { transform: translate(-50%, -24px); opacity: 0; } }
.snack { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(176px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 28px); max-width: 452px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 20; font-size: 14px; }
.snack.low { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.snack button { font-weight: 700; text-decoration: underline; min-height: 34px; padding-inline: 6px; color: var(--bg); }
.proto { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<script src="assets/core.js?v=2"></script>
<script>
(function () {
  'use strict';
  const K = window.Kyomo;
  const V = { tab: 'home', sub: null, sheet: null, busy: false, snack: null, banner: null, err: '', draft: {}, lastOver: false };
  const $ = (id) => document.getElementById(id);
  const esc = K.esc, fmt = K.fmt, ic = K.icon;
  const me = () => K.me();
  const firstName = () => me().name.split(' ')[0];
  const dateLabel = '11月' + K.TODAY + '日(' + K.weekday(K.TODAY) + ')';

  const openTasks = () => {
    const t = K.tasks().filter((x) => !K.isDone(x.id, me().id, 0)).map((x) => ({ id: x.id, title: x.title, due: x.due, kind: 'task' }));
    if (!K.invOf(me().id)) t.unshift({ id: 'stock', title: '11月の制服・インカム棚卸し', due: '11/10', kind: 'stock' });
    return t.sort((a, b) => (a.due || '').localeCompare(b.due || '', 'ja', { numeric: true }));
  };
  const unread = () => K.notices().filter((n) => !K.isDone(n.id, me().id, 0));

  function header(title) {
    const p = me(), now = K.now(), sec = String(Math.floor((now % 1) * 60)).padStart(2, '0');
    if (title) {
      return '<header class="top"><div class="bar">' + (V.sub ? '<button class="back" data-back="1">' + ic('back', 20) + '戻る</button>' : '<span class="brand">キョウモ</span>') + demoBtn() + '</div><h1 class="sub-title">' + esc(title) + '</h1></header>';
    }
    return '<header class="top"><div class="bar"><span class="brand">キョウモ</span>' + demoBtn() + '</div>' +
      '<div class="clock num"><b id="clockHM">' + fmt(now) + '</b><span id="clockS">' + sec + '</span></div>' +
      '<div class="when"><span>' + dateLabel + '</span><span>' + esc(p.name) + 'さん</span></div></header>';
  }
  const demoBtn = () => '<button class="demo-btn" data-sheet="demo">' + ic('sliders', 15) + '試作</button>';

  function homeView() {
    const p = me(), r = K.rec(p), st = K.status(p), dl = K.S.settings.deadline, site = K.storeOf(p);
    let h = header() + '<main class="main home">';
    if (st.key === 'over' && K.S.settings.target !== 'admin') {
      h += '<div class="alarm" role="alert"><b>' + fmt(dl) + 'を過ぎましたが、出勤の記録がありません</b><span>' + (K.S.settings.target === 'both' ? '管理者にも通知されています。' : '') + '現場にいる場合は「出勤」を押してください。</span></div>';
    }
    if (K.S.reminded.stock && !K.invOf(p.id)) h += '<button class="linkcard" data-tab="todo"><span>管理者から棚卸しの催促が届いています</span>' + ic('chev', 18) + '</button>';
    h += '<section class="card"><div class="row"><span class="muted small">今日の現場</span><span class="pill ' + st.pill + '">' + esc(st.label) + '</span></div>';
    if (p.type === '移動型' && r.in == null) {
      const opts = K.stores[p.area].map((s) => '<option' + (s === site ? ' selected' : '') + '>' + esc(s) + '</option>').join('');
      h += '<div class="field"><label for="siteSel" class="small muted">移動型のため、今日の入店先を選んでください</label><select id="siteSel"><option value="">選択してください</option>' + opts + '</select></div>';
    } else {
      h += '<div class="today-site">' + esc(site || '未設定') + '</div>';
    }
    h += '<div class="small muted">' + esc(K.MARKS[p.today]) + ' ／ 出勤の確認 ' + fmt(dl) + '</div></section>';
    h += '<section class="times"><div class="time-cell"><small>出勤</small><b class="num">' + (r.in != null ? fmt(r.in) : '--:--') + '</b>' + (r.loc ? '<div><span class="pill ' + K.locInfo(r.loc).pill + '">' + esc(K.locInfo(r.loc).short) + '</span></div>' : '') + '</div>' +
      '<div class="time-cell"><small>退勤</small><b class="num">' + (r.out != null ? fmt(r.out) : '--:--') + '</b>' + (r.outLoc ? '<div><span class="pill ' + K.locInfo(r.outLoc).pill + '">' + esc(K.locInfo(r.outLoc).short) + '</span></div>' : '') + '</div></section>';
    if (r.in != null && r.loc) {
      h += '<div class="loc-line">' + ic('pin', 16) + '<span>' + esc(K.locInfo(r.loc, r.dist, r.acc).detail) + '</span></div>';
    } else {
      h += '<div class="loc-line">' + ic('pin', 16) + '<span>位置は打刻の瞬間だけ確認します</span></div>';
    }
    const todo = openTasks();
    if (todo.length) h += '<button class="linkcard" data-tab="todo"><span>やることが <b class="num">' + todo.length + '</b> 件（最短の締切 ' + esc(todo[0].due || 'なし') + '）</span>' + ic('chev', 18) + '</button>';
    h += '</main>';
    const inOn = r.in == null, outOn = r.in != null && r.out == null, busy = V.busy;
    h += '<div class="dock">' +
      '<button class="punch in ' + (inOn ? 'on' : '') + '" id="punchIn"' + (inOn && !busy ? '' : ' disabled') + '>' + (busy === 'in' ? '<span class="spin"></span><small>位置を確認中</small>' : (r.in != null ? fmt(r.in) + '<small>出勤済み</small>' : '出勤')) + '</button>' +
      '<button class="punch out ' + (outOn ? 'on' : '') + '" id="punchOut"' + (outOn && !busy ? '' : ' disabled') + '>' + (busy === 'out' ? '<span class="spin"></span><small>位置を確認中</small>' : (r.out != null ? fmt(r.out) + '<small>退勤済み</small>' : '退勤')) + '</button></div>';
    return h;
  }

  function histView() {
    const p = me(), rows = K.historyOf(p);
    const worked = rows.filter((x) => x.in != null).length;
    const planned = p.marks.filter((m) => m !== '休').length;
    let h = header('打刻の履歴') + '<main class="main page"><div class="summary"><div><small>今月の稼働</small><b class="num">' + worked + '</b><small>日</small></div><div><small>今月の予定</small><b class="num">' + planned + '</b><small>日</small></div><div><small>修正の依頼</small><b class="num">' + K.S.fixes.filter((f) => f.pid === p.id && f.state === 'open').length + '</b><small>件</small></div></div>';
    h += '<section class="card" style="padding-block:4px">' + rows.map((x) => {
      const fix = K.S.fixes.find((f) => f.pid === p.id && f.date === '11/' + x.d);
      const work = x.mark !== '休' && x.mark !== '在';
      const time = x.in != null ? '<span class="num">' + fmt(x.in) + ' – ' + (x.out != null ? fmt(x.out) : (x.today ? '勤務中' : '--:--')) + '</span>' : '<span class="muted">' + esc(work ? (x.today ? '未打刻' : '記録なし') : K.MARKS[x.mark]) + '</span>';
      const act = fix ? '<span class="pill ' + (fix.state === 'open' ? 'warn' : 'ok') + '">' + (fix.state === 'open' ? '確認中' : '修正済み') + '</span>' : (work ? '<button class="btn" style="min-height:34px;padding:2px 10px;font-size:12px" data-fix="' + x.d + '">修正を依頼</button>' : '');
      return '<div class="hist-row"><span class="num"><b>' + x.d + '</b>日(' + K.weekday(x.d) + ')</span>' + time + act + '</div>';
    }).join('') + '</section></main>';
    return h;
  }

  function todoView() {
    if (V.sub === 'stock') return stockView();
    if (V.sub && V.sub.indexOf('task:') === 0) return taskView(V.sub.slice(5));
    const p = me(), open = openTasks();
    let h = header('やること') + '<main class="main page">';
    if (!open.length) h += '<section class="card"><b>すべて提出しました</b><span class="small muted">新しい提出物が届くと、ここに表示します。</span></section>';
    h += open.map((t) => '<button class="linkcard task" data-open="' + (t.kind === 'stock' ? 'stock' : 'task:' + t.id) + '"><span><b>' + esc(t.title) + '</b><br><span class="small muted">締切 ' + esc(t.due || 'なし') + '</span></span>' + ic('chev', 18) + '</button>').join('');
    const done = K.tasks().filter((t) => K.isDone(t.id, p.id, 0));
    const inv = K.invOf(p.id);
    if (done.length || inv) {
      h += '<div class="section-label">提出済み</div>';
      if (inv) h += '<section class="card"><div class="row"><span>11月の制服・インカム棚卸し</span><span class="pill ok">' + esc(inv.date) + '</span></div></section>';
      h += done.map((t) => '<section class="card"><div class="row"><span>' + esc(t.title) + '</span><span class="pill ok">提出済み</span></div></section>').join('');
    }
    return h + '</main>';
  }
  function taskView(id) {
    const t = K.tasks().find((x) => x.id === id);
    if (!t) { V.sub = null; return todoView(); }
    return header(t.title) + '<main class="main page"><section class="card"><span class="pill warn" style="justify-self:start">締切 ' + esc(t.due || 'なし') + '</span><p>' + esc(t.body) + '</p></section>' +
      '<div class="field"><label for="taskNote">内容</label><textarea id="taskNote" placeholder="' + esc(t.placeholder || '') + '">' + esc(V.draft.note || '') + '</textarea></div>' +
      '<div class="field"><label for="taskFile">写真やファイル（任意）</label><input id="taskFile" type="file" accept="image/*,.pdf"></div>' +
      (V.err ? '<div class="err">' + esc(V.err) + '</div>' : '') +
      '<button class="btn primary block" data-submit="' + esc(t.id) + '" style="min-height:54px">提出する</button></main>';
  }
  function stockView() {
    const p = me(), inv = K.invOf(p.id), c = K.countsOf(p.id);
    let h = header('制服・インカム棚卸し') + '<main class="main page">';
    h += '<section class="card"><div class="row"><b>手元にある数を入れてください</b><span class="pill ' + (inv ? 'ok' : 'warn') + '">' + (inv ? '提出済み' : '締切 11/10') + '</span></div><span class="small muted">貸与数と違うときは、事務局に自動で知らせます。</span></section>';
    h += '<section class="card" style="padding-block:2px">' + K.ITEMS.map((i) => {
      const diff = c[i.k] - i.lent;
      return '<div class="step-row"><div><b>' + i.n + '</b><br><span class="small muted">貸与 ' + i.lent + i.u + '</span>' + (diff ? '<span class="diff">貸与数と ' + Math.abs(diff) + i.u + ' 違います</span>' : '') + '</div><div class="steps"><button data-step="' + i.k + '" data-d="-1" aria-label="' + i.n + 'を減らす"' + (inv ? ' disabled' : '') + '>−</button><span class="num">' + c[i.k] + '</span><button data-step="' + i.k + '" data-d="1" aria-label="' + i.n + 'を増やす"' + (inv ? ' disabled' : '') + '>＋</button></div></div>';
    }).join('') + '</section>';
    if (!inv) h += '<button class="btn primary block" id="submitStock" style="min-height:54px">この内容で提出する</button>';
    return h + '</main>';
  }

  function newsView() {
    const id = me().id;
    return header('お知らせ') + '<main class="main page">' + K.notices().map((n) => {
      const d = K.isDone(n.id, id, 0);
      return '<section class="card"><div class="row"><b>' + esc(n.title) + '</b>' + (d ? '<span class="pill idle">確認済み</span>' : '<span class="pill bad">未確認</span>') + '</div><span class="small muted">' + esc(n.date || '') + (n.important ? '　重要' : '') + '</span><p class="small">' + esc(n.body) + '</p>' + (d ? '' : '<div><button class="btn" data-read="' + esc(n.id) + '">確認しました</button></div>') + '</section>';
    }).join('') + '</main>';
  }

  function helpView() {
    const s = K.S.settings;
    return header('相談窓口') + '<main class="main page"><div class="safe"><b>ひとりで抱えなくて大丈夫です</b><span>相談内容も、この画面を開いたことも、アプリには記録しません。管理者の画面にも表示されません。</span></div>' +
      '<section class="card"><b>社内の相談窓口</b><span class="contact">' + esc(s.inner) + '</span></section>' +
      '<section class="card"><b>社外の相談窓口</b><span class="contact">' + esc(s.outer) + '</span><span class="small muted">社内の人に話しにくいときは、こちらへ。</span></section>' +
      '<section class="card"><ul class="bullets"><li>業務委託、アルバイト、契約社員など、働き方を問わず相談できます。</li><li>相手が上司、同僚、取引先、お客様でも相談できます。</li><li>相談したことを理由に不利益な扱いをすることは、禁止されています。</li></ul></section></main>';
  }

  function tabs() {
    const list = [['home', '打刻', 'clock'], ['hist', '履歴', 'hist'], ['todo', 'やること', 'list'], ['news', 'お知らせ', 'bell'], ['help', '相談', 'help']];
    const counts = { todo: openTasks().length, news: unread().length };
    return '<nav class="tabs" aria-label="メニュー">' + list.map((t) => '<button data-tab="' + t[0] + '"' + (V.tab === t[0] ? ' aria-current="page"' : '') + '>' + ic(t[2], 24) + t[1] + (counts[t[0]] ? '<span class="dot num">' + counts[t[0]] + '</span>' : '') + '</button>').join('') + '</nav>';
  }

  function demoSheet() {
    const now = K.nowMin(), g = K.S.gps;
    const gpsOpts = [['real', '実際のGPS'], ['in', '現場内'], ['out', '現場外'], ['none', '取得不可']];
    return '<div class="sheet-back" data-close="1"></div><div class="sheet" role="dialog" aria-label="試作の操作"><h2>試作の操作</h2>' +
      '<div class="field"><span class="lab">時刻 <span class="num">' + fmt(now) + '</span></span><div class="jump-row">' + [[592, '09:52'], [614, '10:14'], [616, '10:16'], [1141, '19:01']].map((j) => '<button class="btn num" data-jump="' + j[0] + '">' + j[1] + '</button>').join('') + '<button class="btn" data-jump="real">今の時刻</button></div></div>' +
      '<div class="field"><span class="lab">スタッフ</span><div class="seg">' + [['me1', '常勤'], ['me2', '移動型']].map((o) => '<button data-persona="' + o[0] + '" aria-pressed="' + (K.S.persona === o[0]) + '">' + o[1] + '（' + esc(K.byId[o[0]].name) + '）</button>').join('') + '</div></div>' +
      '<div class="field"><span class="lab">打刻時の位置</span><div class="seg">' + gpsOpts.map((o) => '<button data-gps="' + o[0] + '" aria-pressed="' + (g === o[0]) + '">' + o[1] + '</button>').join('') + '</div>' +
      (g === 'real' ? '<span class="small muted">サンプル現場の位置は山口市です。今いる場所で範囲内を試すときは、下のボタンで現在地を現場に登録してください。</span><button class="btn" id="setGeo">' + ic('pin', 18) + '今いる場所を現場に登録</button>' : '') + '</div>' +
      (V.err ? '<div class="err">' + esc(V.err) + '</div>' : '') +
      '<a class="btn" href="admin/" style="text-decoration:none">' + ic('users', 18) + '管理者アプリを開く</a>' +
      '<button class="btn" data-reset="1">最初の状態に戻す</button>' +
      '<p class="proto">試作版 2 ／ データは架空のサンプルで、この端末の中だけに保存します。</p>' +
      '<button class="btn primary" data-close="1">閉じる</button></div>';
  }
  function gpsSheet() {
    return '<div class="sheet-back"></div><div class="sheet" role="dialog" aria-label="位置情報の確認"><h2>位置情報の使い方</h2><p>現場にいることの確認のため、<b>打刻の瞬間だけ</b>位置を取得します。勤務中や休みの日に追跡することはありません。</p><p class="small muted">このあとスマホの確認画面が出たら「許可」を選んでください。許可しなくても打刻はでき、管理者に確認の印が付きます。</p><button class="btn primary" id="gpsAgree" style="min-height:54px">わかりました</button></div>';
  }
  function fixSheet() {
    const d = V.fixDay;
    return '<div class="sheet-back" data-close="1"></div><div class="sheet" role="dialog" aria-label="修正の依頼"><h2>' + d + '日の修正を依頼</h2><div class="field"><label for="fixKind">内容</label><select id="fixKind"><option>出勤の打刻忘れ</option><option>退勤の打刻忘れ</option><option>時刻の間違い</option></select></div><div class="field"><label for="fixDetail">正しい時刻やメモ</label><input id="fixDetail" placeholder="例: 19:05 に退勤しました"></div>' + (V.err ? '<div class="err">' + esc(V.err) + '</div>' : '') + '<button class="btn primary" id="sendFix" style="min-height:50px">依頼を送る</button></div>';
  }

  function render() {
    const views = { home: homeView, hist: histView, todo: todoView, news: newsView, help: helpView };
    $('app').innerHTML = views[V.tab]() + tabs();
    renderOverlay();
  }
  function renderOverlay() {
    let h = '';
    if (V.banner) h += '<div class="banner" role="alert"><b>' + ic('alert', 16) + esc(V.banner.title) + '</b><span>' + esc(V.banner.body) + '</span></div>';
    if (V.snack) h += '<div class="snack' + (V.tab === 'home' ? '' : ' low') + '" role="status"><span>' + esc(V.snack.text) + '</span>' + (V.snack.undo ? '<button id="undoBtn">取り消す</button>' : '') + '</div>';
    if (V.sheet === 'demo') h += demoSheet();
    if (V.sheet === 'gps') h += gpsSheet();
    if (V.sheet === 'fix') h += fixSheet();
    $('overlay').innerHTML = h;
  }
  let snackT, bannerT;
  function snack(text, undo) {
    V.snack = { text, undo };
    clearTimeout(snackT);
    snackT = setTimeout(() => { V.snack = null; renderOverlay(); }, undo ? 10000 : 2800);
    renderOverlay();
  }

  function locate() {
    return new Promise((resolve) => {
      const mode = K.S.gps;
      if (mode !== 'real') {
        setTimeout(() => resolve(mode === 'in' ? { loc: 'in', dist: 32 } : mode === 'out' ? { loc: 'out', dist: 1800 } : { loc: 'none' }), 500);
        return;
      }
      if (!navigator.geolocation) { resolve({ loc: 'none' }); return; }
      navigator.geolocation.getCurrentPosition((pos) => {
        const c = pos.coords, g = K.S.storeGeo, r = K.S.settings.radius;
        const dist = K.distanceM(c.latitude, c.longitude, g.lat, g.lng);
        if (dist <= r) resolve({ loc: 'in', dist, acc: c.accuracy });
        else if (c.accuracy > Math.max(500, r * 2)) resolve({ loc: 'low', dist, acc: c.accuracy });
        else resolve({ loc: 'out', dist, acc: c.accuracy });
      }, () => resolve({ loc: 'none' }), { enableHighAccuracy: true, timeout: 9000, maximumAge: 0 });
    });
  }
  async function punch(kind) {
    const p = me();
    if (kind === 'in' && p.type === '移動型' && !K.storeOf(p)) { snack('今日の入店先を選んでください'); return; }
    if (K.S.gps === 'real' && !K.S.gpsOk) { V.pending = kind; V.sheet = 'gps'; renderOverlay(); return; }
    V.busy = kind; render();
    const at = K.nowMin(), g = await locate();
    V.busy = false;
    if (kind === 'in') {
      K.S.punches[p.id] = { in: at, loc: g.loc, dist: g.dist, acc: g.acc, out: null };
    } else {
      Object.assign(K.S.punches[p.id] = K.S.punches[p.id] || { in: at }, { out: at, outLoc: g.loc, outDist: g.dist });
    }
    K.save();
    try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) { /* 無視 */ }
    render();
    V.undo = kind;
    snack((kind === 'in' ? '出勤' : '退勤') + 'を ' + fmt(at) + ' に記録しました', true);
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button, [data-close]');
    if (!b) return;
    const d = b.dataset;
    if (d.tab) { V.tab = d.tab; V.sub = null; V.err = ''; window.scrollTo(0, 0); render(); return; }
    if (d.back) { V.sub = null; V.err = ''; V.draft = {}; render(); return; }
    if (d.sheet) { V.sheet = d.sheet; V.err = ''; renderOverlay(); return; }
    if (d.close) { V.sheet = null; V.err = ''; renderOverlay(); return; }
    if (d.jump) {
      if (d.jump === 'real') { const n = new Date(); K.setNow(n.getHours() * 60 + n.getMinutes()); } else K.setNow(+d.jump);
      V.lastOver = K.status(me()).key === 'over'; V.sheet = null; checkOverdue(true); render(); return;
    }
    if (d.persona) { K.S.persona = d.persona; K.save(); V.sheet = 'demo'; render(); return; }
    if (d.gps) { K.S.gps = d.gps; K.save(); renderOverlay(); return; }
    if (d.reset) { K.reset(); V.sheet = null; V.tab = 'home'; V.sub = null; V.snack = null; V.banner = null; render(); snack('最初の状態に戻しました'); return; }
    if (b.id === 'punchIn') { punch('in'); return; }
    if (b.id === 'punchOut') { punch('out'); return; }
    if (b.id === 'gpsAgree') { K.S.gpsOk = true; K.save(); V.sheet = null; renderOverlay(); punch(V.pending); return; }
    if (b.id === 'undoBtn') {
      const p = K.S.punches[me().id];
      if (p) { if (V.undo === 'out') { p.out = null; p.outLoc = null; } else delete K.S.punches[me().id]; K.save(); }
      V.snack = null; render(); return;
    }
    if (b.id === 'setGeo') {
      V.err = '';
      if (!navigator.geolocation) { V.err = 'この端末では位置情報を使えません。'; renderOverlay(); return; }
      navigator.geolocation.getCurrentPosition((pos) => {
        K.S.storeGeo = { lat: pos.coords.latitude, lng: pos.coords.longitude }; K.save();
        V.sheet = null; renderOverlay(); snack('今いる場所を現場に登録しました');
      }, () => { V.err = '位置を取得できませんでした。スマホの設定で、ブラウザの位置情報を許可してください。'; renderOverlay(); }, { enableHighAccuracy: true, timeout: 9000, maximumAge: 0 });
      return;
    }
    if (d.fix) { V.fixDay = +d.fix; V.sheet = 'fix'; V.err = ''; renderOverlay(); return; }
    if (b.id === 'sendFix') {
      const detail = $('fixDetail').value.trim();
      if (!detail) { V.err = '正しい時刻かメモを入れてください。'; renderOverlay(); return; }
      K.S.fixes.unshift({ id: 'fx' + Date.now(), pid: me().id, date: '11/' + V.fixDay, kind: $('fixKind').value, detail, state: 'open' });
      K.save(); V.sheet = null; V.err = ''; render(); snack('修正の依頼を送りました'); return;
    }
    if (d.open) { V.sub = d.open; V.err = ''; V.draft = {}; window.scrollTo(0, 0); render(); return; }
    if (d.submit) {
      const note = $('taskNote').value.trim(), file = $('taskFile').files[0];
      if (!note && !file) { V.err = '内容を入れるか、ファイルを選んでください。'; V.draft.note = note; render(); return; }
      K.setDone(d.submit, me().id); K.S.notes[d.submit + ':' + me().id] = note; K.save();
      V.sub = null; V.err = ''; render(); snack('提出しました'); return;
    }
    if (d.step) {
      const c = K.countsOf(me().id);
      c[d.step] = Math.max(0, Math.min(9, c[d.step] + (+d.d))); K.save(); render(); return;
    }
    if (b.id === 'submitStock') {
      const c = K.countsOf(me().id);
      K.S.inv[me().id] = { date: '11/' + K.TODAY, miss: K.ITEMS.filter((i) => c[i.k] !== i.lent).map((i) => ({ k: i.k, count: c[i.k] })) };
      K.save(); V.sub = null; render(); snack('棚卸しを提出しました'); return;
    }
    if (d.read) { K.setDone(d.read, me().id); render(); return; }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'siteSel') {
      if (e.target.value) K.S.todayStore[me().id] = e.target.value; else delete K.S.todayStore[me().id];
      K.save();
    }
  });
  document.addEventListener('input', (e) => { if (e.target.id === 'taskNote') V.draft.note = e.target.value; });

  function checkOverdue(silentIfNot) {
    const over = K.status(me()).key === 'over' && K.S.settings.target !== 'admin';
    if (over && (!V.notified || silentIfNot)) {
      V.notified = true;
      V.banner = { title: '出勤の記録がありません', body: fmt(K.S.settings.deadline) + 'を過ぎました。現場にいる場合は打刻してください。' };
      clearTimeout(bannerT);
      bannerT = setTimeout(() => { V.banner = null; renderOverlay(); }, 6000);
      try { if (navigator.vibrate) navigator.vibrate([60, 60, 60]); } catch (e) { /* 無視 */ }
    }
    if (!over) { V.notified = false; }
  }
  const activeIsForm = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); };
  let lastMin = K.nowMin();
  setInterval(() => {
    const now = K.now(), m = Math.floor(now);
    const hm = $('clockHM'), s = $('clockS');
    if (hm) { hm.textContent = fmt(now); s.textContent = String(Math.floor((now % 1) * 60)).padStart(2, '0'); }
    if (m !== lastMin) {
      lastMin = m;
      checkOverdue();
      if (!activeIsForm() && !V.sheet && !V.busy) render(); else renderOverlay();
    }
  }, 1000);
  K.onChange(() => { if (!activeIsForm()) render(); });
  V.lastOver = false;
  render();
})();
</script>
</body>
</html>
