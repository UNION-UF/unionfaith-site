<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ページが見つかりません｜Union Faith株式会社</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E0E0F">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+Antique:wght@900&text=%E3%81%8B%E3%81%8C%E3%81%9B%E3%81%A4%E3%81%BE%E3%82%8A%E3%82%93%E3%82%B8%E3%83%9A%E3%83%BC%E8%A6%8B&display=swap">
<style>
:root{
  color-scheme:light;
  --ink:#0E0E0F;
  --paper:#F3F3F1;
  --white:#FFFFFF;
  --muted:#5E5E5B;
  --line:#D8D8D4;
  --on-ink:#F3F3F1;
  --ink-line:#303032;
  --green:#5BB381;
  --note:#1B5FA6;
  --f-display:"Zen Kaku Gothic Antique","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","YuGothic","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  --gut:clamp(1.25rem,5vw,3rem);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.95 var(--f-body);line-break:strict;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
h1,h2,p,ul,ol,dl,dd{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--note);outline-offset:3px}
img{max-width:100%}
.wrap{width:100%;max-width:46rem;margin-inline:auto;padding-inline:var(--gut)}
.hd{background:var(--ink);color:var(--on-ink);border-bottom:1px solid var(--ink-line)}
.hd .wrap{max-width:88rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:4rem}
.brand{display:flex;align-items:center;gap:.65rem;font:700 1rem/1.3 var(--f-body);text-decoration:none;white-space:nowrap}
.brand img{display:block;height:2.1rem;width:auto}
.back{font-size:.875rem;font-weight:700;text-decoration:none;padding:.45rem 1rem;border:1.5px solid var(--on-ink);border-radius:999px;white-space:nowrap}
main{padding-block:clamp(3rem,8vw,5.5rem) clamp(4rem,10vw,6.5rem)}
h1{font:900 clamp(1.9rem,6vw,3rem)/1.3 var(--f-display);font-feature-settings:"palt"}
.lead{margin-top:1.25rem}
.items{display:grid;gap:clamp(1.75rem,4vw,2.5rem);margin-top:clamp(2.5rem,6vw,3.5rem);padding:0;list-style:none}
.items h2{display:flex;align-items:center;gap:.75rem;font:700 1.1875rem/1.5 var(--f-body);margin-bottom:.5rem}
.items h2::before{content:"";flex:none;width:1.5rem;height:3px;background:var(--green)}
.items ul{padding-left:1.25em}
.desk{margin-top:.5rem;display:grid;gap:.1rem}
.tbd{display:inline-flex;padding:.05em .7em;border:1.5px dashed var(--note);border-radius:999px;color:var(--note);font-size:.8125rem;font-weight:700;line-height:1.7;white-space:nowrap}
.ft{background:var(--ink);color:#A9A9A5;font-size:.8125rem;padding-block:1.5rem}
</style>
</head>
<body>
<header class="hd">
  <div class="wrap">
    <a class="brand" href="/"><img src="img/logo-160.webp" width="160" height="111" alt=""><span>Union Faith株式会社</span></a>
    <a class="back" href="/">トップへ戻る</a>
  </div>
</header>

<main class="wrap">
  <h1>ページが見つかりません</h1>
  <p class="lead">お探しのページは、移動または削除された可能性があります。</p>
  <p class="lead"><a href="/">トップページへ戻る</a></p>
</main>

<footer class="ft">
  <div class="wrap">&copy; 2026 Union Faith株式会社</div>
</footer>
</body>
</html>
