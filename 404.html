<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ページが見つかりません｜Union Faith株式会社</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&display=swap">
<style>
/* トップページと同じ「余白と明朝」の見た目にそろえた下層ページ */
:root{
  --bg:#FFFFFF;--bg2:#F6F5F2;--ink:#1C1C1B;--sub:#6B6A66;--line:#E3E1DC;--green:#288465;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","YuGothic","Meiryo","Noto Sans JP",sans-serif;
  --gut:clamp(1.25rem,5vw,4rem);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 .9375rem/2.05 var(--sans);letter-spacing:.04em;line-break:strict;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
h1,h2,p,ul,ol,dl,dd{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
img{display:block;max-width:100%}
.wrap{width:100%;max-width:46rem;margin-inline:auto;padding-inline:var(--gut)}
.hd{padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.hd .wrap{max-width:none;display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:4.5rem}
.brand{display:flex;align-items:center;gap:.75rem;font:600 .9375rem/1 var(--serif);letter-spacing:.08em;text-decoration:none;white-space:nowrap}
.brand img{height:2.125rem;width:auto}
.back{display:inline-flex;align-items:center;gap:.9rem;padding:.6rem 1.1rem;border:1px solid var(--ink);font-size:.8125rem;letter-spacing:.12em;text-decoration:none;white-space:nowrap;transition:background-color .4s,color .4s}
.back i{font-style:normal;color:var(--green)}
.back:hover{background:var(--ink);color:#fff}
main{padding-block:clamp(4rem,10vw,7rem) clamp(5rem,12vw,8rem)}
h1{font:600 clamp(1.75rem,4.4vw,2.5rem)/1.6 var(--serif);letter-spacing:.08em}
.lead{margin-top:1.5rem;color:var(--sub)}
.items{display:grid;gap:clamp(2rem,5vw,3rem);margin-top:clamp(3rem,7vw,4.5rem);padding:0;list-style:none}
.items h2{display:flex;align-items:center;gap:.9rem;margin-bottom:.6rem;font:600 1.125rem/1.6 var(--serif);letter-spacing:.08em}
.items h2::before{content:"";flex:none;width:1.75rem;height:1px;background:var(--green)}
.items p{color:#3A3A38}
.items ul{padding-left:1.25em;color:#3A3A38}
.desk{margin-top:.5rem;display:grid;gap:.1rem}
.ft{background:var(--bg2);color:var(--sub);font-size:.75rem;letter-spacing:.12em;padding-block:2rem calc(2rem + env(safe-area-inset-bottom,0px))}
.ft .wrap{max-width:none}
@media (max-width:30rem){.brand{font-size:.8125rem;letter-spacing:.04em;gap:.5rem}.brand img{height:1.75rem}.back{padding:.5rem .75rem;letter-spacing:.06em}.back i{display:none}}
</style>
</head>
<body>
<header class="hd">
  <div class="wrap">
    <a class="brand" href="/"><img src="/img/logo-color-160.webp" srcset="/img/logo-color-160.webp 1x, /img/logo-color-320.webp 2x" width="160" height="112" alt=""><span>Union Faith株式会社</span></a>
    <a class="back" href="/">トップへ戻る<i aria-hidden="true">&rarr;</i></a>
  </div>
</header>

<main class="wrap">
  <h1>ページが見つかりません</h1>
  <p class="lead">お探しのページは、移動または削除された可能性があります。</p>
  <p class="lead"><a href="/">トップページへ戻る</a></p>
</main>

<footer class="ft">
  <div class="wrap">&copy; 2026 Union Faith Inc.</div>
</footer>
</body>
</html>
